<title>Aziz Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: glass sidebar (desktop) / floating glass tab bar (phone) over a soft colour-field wallpaper; content is a grid of frosted cards. */
:root{
  --wall-1:#cfe0ff; --wall-2:#ffd9c7; --wall-3:#d4f3e4; --wall-4:#efe3ff; --wall-base:#eef1f7;
  --glass:rgba(255,255,255,.48); --glass-strong:rgba(255,255,255,.70); --glass-edge:rgba(255,255,255,.85);
  --glass-shadow:0 10px 30px rgba(40,50,90,.12), 0 1px 2px rgba(40,50,90,.08);
  --fg:#141824; --fg-2:#4a5266; --fg-3:#7c8499; --hair:rgba(20,24,36,.08); --scrim:rgba(20,24,40,.22);
  --accent:#0a84ff; --on-warm:#ffb340;
  --ok:#22a55a; --warn:#e08a00; --bad:#e5484d; --cool:#30b0c7;
  --floor:#f3efe8; --wall3d:#d9dde8; --label3d:#4a5266;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --font-d: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  --r-lg:26px; --r-md:20px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --wall-1:#1d2b5c; --wall-2:#4a2337; --wall-3:#123b36; --wall-4:#2c1f4f; --wall-base:#0b0d16;
  --glass:rgba(38,42,58,.46); --glass-strong:rgba(58,63,84,.66); --glass-edge:rgba(255,255,255,.14);
  --glass-shadow:0 10px 30px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  --fg:#f2f4fa; --fg-2:#b5bccd; --fg-3:#8189a0; --hair:rgba(255,255,255,.09); --scrim:rgba(0,0,0,.45);
  --accent:#409cff; --on-warm:#ffc061;
  --ok:#3ccf7a; --warn:#ffb020; --bad:#ff6369; --cool:#5ad0e6;
  --floor:#2a2f40; --wall3d:#454c63; --label3d:#b5bccd; color-scheme:dark }}
:root[data-theme="dark"]{
  --wall-1:#1d2b5c; --wall-2:#4a2337; --wall-3:#123b36; --wall-4:#2c1f4f; --wall-base:#0b0d16;
  --glass:rgba(38,42,58,.46); --glass-strong:rgba(58,63,84,.66); --glass-edge:rgba(255,255,255,.14);
  --glass-shadow:0 10px 30px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  --fg:#f2f4fa; --fg-2:#b5bccd; --fg-3:#8189a0; --hair:rgba(255,255,255,.09); --scrim:rgba(0,0,0,.45);
  --accent:#409cff; --on-warm:#ffc061;
  --ok:#3ccf7a; --warn:#ffb020; --bad:#ff6369; --cool:#5ad0e6;
  --floor:#2a2f40; --wall3d:#454c63; --label3d:#b5bccd; color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:var(--font);color:var(--fg);background:var(--wall-base);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4}
body::after{content:"";position:fixed;inset:-10%;z-index:-1;background:
  radial-gradient(40% 35% at 15% 20%,var(--wall-1),transparent 70%),
  radial-gradient(35% 35% at 85% 15%,var(--wall-2),transparent 70%),
  radial-gradient(45% 40% at 70% 85%,var(--wall-3),transparent 70%),
  radial-gradient(35% 35% at 20% 90%,var(--wall-4),transparent 70%), var(--wall-base)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.sm{width:14px;height:14px}

.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);
  border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-edge);border-radius:var(--r-lg)}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;max-width:1440px;margin:0 auto;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(24px + env(safe-area-inset-top,0px));height:calc(100vh - 48px);display:flex;flex-direction:column;gap:4px;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-family:var(--font-d);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand span{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#7d5cff);color:#fff}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;color:var(--fg-2);font-weight:500;text-decoration:none}
.nav:hover{background:var(--hair)}
.nav[aria-current="page"]{background:var(--glass-strong);color:var(--fg);box-shadow:inset 0 1px 0 var(--glass-edge),0 2px 8px rgba(0,0,0,.06)}
.side .foot{margin-top:auto;padding:10px 6px;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--fg-3)}
.side .foot .seg{width:100%}.side .foot .seg button{flex:1}
main{min-width:0;display:flex;flex-direction:column;gap:22px;padding-bottom:40px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{margin:0;font-family:var(--font-d);font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--fg-2)}
.top .row{align-items:center}
.wx{display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:18px}
.wx b{font-family:var(--font-d);font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wx small{display:block;color:var(--fg-2);font-size:12px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.phone-only{display:none!important}

h2{margin:0 0 12px;font-family:var(--font-d);font-size:20px;font-weight:650;letter-spacing:-.015em;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
h2 .meta{font-size:13px;font-weight:500;color:var(--fg-3);font-family:var(--font)}
h2 .end{margin-left:auto}
.sec{min-width:0}

/* segmented control */
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--hair);gap:2px;font-family:var(--font)}
.seg button{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--fg-2);white-space:nowrap;transition:background .2s}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.12),inset 0 1px 0 var(--glass-edge)}
.seg.full{display:flex;width:100%}.seg.full button{flex:1;padding-inline:4px}

/* chips + scenes */
.row{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:500;min-width:0}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--fg-3);flex:none}
.chip.ok .dot{background:var(--ok)} .chip.warn .dot{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 25%,transparent)}
.chip.bad .dot{background:var(--bad)}
.chip small{color:var(--fg-3);font-weight:400}
.scene{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;font-weight:600;transition:transform .15s}
.scene:active{transform:scale(.96)}
.scene .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{--glow:var(--on-warm);position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r-md);min-height:118px;min-width:0;transition:background .25s,transform .15s}
.tile .hit{position:absolute;inset:0;border-radius:inherit}
.tile .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--hair);color:var(--fg-2);transition:all .25s;pointer-events:none}
.tile .nm{font-weight:600;font-size:14.5px;line-height:1.25;pointer-events:none;overflow-wrap:anywhere}
.tile .st{font-size:13px;color:var(--fg-3);pointer-events:none;font-variant-numeric:tabular-nums}
.tile.on{background:linear-gradient(160deg,color-mix(in srgb,var(--glow) 34%,transparent),var(--glass) 72%)}
.tile.on .ico{background:var(--glow);color:#2b2111;box-shadow:0 0 18px color-mix(in srgb,var(--glow) 70%,transparent)}
.tile.on.rgb .ico{color:#fff}
.tile.on .st{color:var(--fg-2)}
.tile.off-line{opacity:.6}
.tile.off-line .st{color:var(--bad)}
.tile:active{transform:scale(.98)}
.tile input[type=range]{position:relative;z-index:1;width:100%;margin-top:auto;accent-color:var(--glow);height:22px}
.tile .adj{position:absolute;z-index:2;top:10px;right:10px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--hair);color:var(--fg-2)}
.tile .adj:hover{background:var(--glass-strong)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{padding:18px;min-width:0}
.card.wide{grid-column:1/-1}
.card h3{margin:0;font-family:var(--font-d);font-size:17px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--hair);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span:first-child{display:flex;align-items:center;gap:10px;color:var(--fg-2);min-width:0}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);margin:16px 0 8px;display:flex;justify-content:space-between}
.lbl b{letter-spacing:0;text-transform:none;color:var(--fg-2);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--hair);color:var(--fg-2);white-space:nowrap}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.cool{color:var(--cool);background:color-mix(in srgb,var(--cool) 16%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--glass-edge);font-weight:600;font-size:14px;box-shadow:inset 0 1px 0 var(--glass-edge)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.small{padding:6px 12px;font-size:13px}
.btn:active{transform:scale(.97)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--hair);color:var(--fg-2);border:1px solid transparent}
.tog[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}

/* room summary */
.room{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-md);text-align:left;min-width:0;color:inherit;text-decoration:none}
.room .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.room b{font-family:var(--font-d);font-size:16px;font-weight:650}
.room .r2{display:flex;flex-wrap:wrap;gap:6px}

/* climate */
.temp{font-family:var(--font-d);font-size:46px;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;margin:14px 0 4px}
.temp sup{font-size:20px;font-weight:400;vertical-align:top;margin-left:2px}
.stepper{display:flex;align-items:center;gap:10px;margin-top:12px}
.stepper button{width:38px;height:38px;border-radius:50%;background:var(--glass-strong);border:1px solid var(--glass-edge);font-size:20px;font-weight:500}
.stepper output{flex:1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

/* ring */
.ring{width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--hair) 0)}
.ring>div{width:96px;height:96px;border-radius:50%;background:var(--glass-strong);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--font-d);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;display:block}
.ring small{font-size:11px;color:var(--fg-3)}
.flex{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:var(--hair);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:inherit}

/* presence zones */
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.zone{border-radius:14px;padding:12px 8px;text-align:center;font-size:12.5px;font-weight:600;background:var(--hair);color:var(--fg-3);transition:all .3s}
.zone.on{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}

/* 3D */
.stage{position:relative;height:min(62vh,560px);min-height:360px;border-radius:var(--r-lg);overflow:hidden}
.stage canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.stage .hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;pointer-events:none}
.stage .hud>*{pointer-events:auto}
.stage .load{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg-3);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--fg-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.plan{width:100%;height:auto;display:block}
.plan .rm{fill:var(--hair);stroke:var(--fg-3);stroke-width:2;transition:fill .4s}
.plan .rm.lit{fill:color-mix(in srgb,var(--on-warm) 32%,transparent)}
.plan text{fill:var(--fg-2);font:600 13px var(--font)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{width:min(460px,100%);padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:30px;max-height:90vh;overflow:auto;background:var(--glass-strong)}
.sheet .hd{display:flex;align-items:center;gap:12px}
.sheet .hd .ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--glow,var(--hair));color:#2b2111;box-shadow:0 0 22px color-mix(in srgb,var(--glow,transparent) 70%,transparent)}
.sheet .hd .ico.off{background:var(--hair);color:var(--fg-2);box-shadow:none}
.sheet .hd b{display:block;font-family:var(--font-d);font-size:19px}
.sheet .hd small{color:var(--fg-3)}
.sw{margin-left:auto;width:52px;height:32px;border-radius:99px;background:var(--hair);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-pressed="true"]{background:var(--ok)}.sw[aria-pressed="true"]::after{transform:translateX(20px)}
.big{-webkit-appearance:none;appearance:none;width:100%;height:44px;border-radius:16px;background:var(--hair);outline-offset:3px;cursor:pointer}
.big.bri{background:linear-gradient(90deg,var(--hair),var(--glow,var(--on-warm)))}
.big.kel{background:linear-gradient(90deg,#ff9329,#ffce96 45%,#ecf3ff 100%)}
.big.hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.big::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:38px;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.big::-moz-range-thumb{width:30px;height:38px;border-radius:12px;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.swatches button[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}

/* tab bar (phone) */
.tabbar{display:none}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;pointer-events:none;transition:all .3s;z-index:70;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* vacation */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 16px;border-radius:22px;background:linear-gradient(120deg,color-mix(in srgb,#ff375f 20%,transparent),var(--glass) 62%)}
.banner .bico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ff375f;color:#fff;flex:none}
.banner .btxt{flex:1;min-width:180px}.banner b{display:block;font-family:var(--font-d);font-size:16px}.banner small{color:var(--fg-2)}
.vin{font:inherit;color:var(--fg);background:var(--hair);border:1px solid var(--glass-edge);border-radius:12px;padding:9px 12px;margin-top:8px;width:100%}
.flag{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--hair)}
.flag>div{flex:1;min-width:0;font-weight:600;font-size:14.5px}.flag small{display:block;color:var(--fg-3);font-size:12.5px;font-weight:400}
.mini{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13.5px;color:var(--fg-2)}
.mini button{width:30px;height:30px;border-radius:50%;background:var(--glass-strong);border:1px solid var(--glass-edge);font-weight:600}
.sw:disabled{opacity:.35}

@media (min-width:821px){.sheet-wrap{align-items:center}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);padding-block:16px 110px}
  .side{display:none}
  .phone-only{display:grid!important}
  .tabbar{display:flex;position:fixed;z-index:40;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
    bottom:calc(12px + env(safe-area-inset-bottom,0px));justify-content:space-around;padding:6px;border-radius:30px}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:22px;font-size:10.5px;font-weight:600;color:var(--fg-2);text-decoration:none;min-width:0}
  .tabbar a[aria-current="page"]{background:var(--glass-strong);color:var(--accent)}
  .toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{grid-template-columns:minmax(0,1fr)}
  .sheet-wrap{padding:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pulse{50%{opacity:.35}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.note{font-size:12.5px;color:var(--fg-3)}
</style>

<div class="app">
  <nav class="side glass" aria-label="Sections" id="side"></nav>
  <main id="main"></main>
</div>
<nav class="tabbar glass" aria-label="Sections" id="tabbar"></nav>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="toast glass" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- icons ---------- */
const P={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 rooms:'<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
 climate:'<path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M12 9v7"/>',

const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const days=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const fmtD=(s)=>new Date(s+'T12:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const vacOn=()=>S[VAC_ID].on;

function nextRobot(V){let d=addDays(V.start,V.robotEvery);while(d<today())d=addDays(d,V.robotEvery);return V.end&&d>V.end?null:d}
const luxLabel=(l)=>l<50?'Dark':l<200?'Dim':l<500?'Bright':'Very bright';
/* warm (2200 K) → neutral (3000 K) → cool (4000 K), approximated for display */
function kColor(k){const s=[[2200,[255,147,41]],[3000,[255,206,150]],[4000,[236,243,255]]];
  const i=k<=3000?0:1,[k0,a]=s[i],[k1,b]=s[i+1],t=Math.min(1,Math.max(0,(k-k0)/(k1-k0)));
  return `rgb(${a.map((v,j)=>Math.round(v+(b[j]-v)*t)).join(',')})`}
const glow=(e)=>e.rgb||(e.kelvin?kColor(e.kelvin):null);

}

      ...(r.id==='living'?[(a=>a.available?infoTile('leaf','Air quality',`${a.rating||'—'} · CO₂ ${a.co2??'—'} ppm · PM2.5 ${a.pm25??'—'}`):infoTile('leaf','Air Quality Monitor','Offline · re-pair in IKEA app','off-line'))(S['sensor.air_quality_monitor'])]:[]),

      ...(r.id==='studio'?[infoTile('lux','Light level',`${S['sensor.studio_illuminance'].lux} lx · ${luxLabel(S['sensor.studio_illuminance'].lux)}`),infoTile('robot','Roborock Q5 Pro',`${vacStatus()} · ${S[VAC].battery}%`,S[VAC].status==='Cleaning'?'on':'')]:[]),

  }).join('');

  const flag=(k,n,dsc,dis)=>`<div class="flag"><div>${n}<small>${dsc}</small></div><button class="sw" data-vdflag="${k}" aria-pressed="${VD[k]&&!dis}" ${dis?'disabled':''} aria-label="${n}"></button></div>`;

function startVacation(){const V=S[VAC_ID],st=VD.startMode==='now'?today():VD.start,dated=VD.endMode==='date';
  Object.assign(V,{start:st,end:dated?VD.end:null,robotEvery:VD.robotEvery,robotTime:VD.robotTime,alerts:VD.alerts,preheat:VD.preheat&&dated,preheatH:VD.preheatH,sim:VD.sim,humidity:VD.humidity});
  closeSheet();
  if(st>today()){V.scheduled=true;V.on=false;update();toast(`Vacation scheduled from ${fmtD(st)}`)}else{activateVac();update()}}

  if(was)ids('climate.').forEach(k=>S[k].preset='Schedule');update();toast(was?'Welcome back. Normal mode restored':'Vacation cancelled')}

// Room rectangles in metres, measured from Home layout.PNG (x → right, z → down, origin = living room top-left).
const R3={living:[0,0,6.29,4.2],studio:[6.29,0,9.79,4.2],balcony:[3.63,-1.41,7.08,0],bedroom:[0,4.2,3.93,8.6],
  hallway:[3.93,4.2,8.56,5.61],kitchen:[3.93,5.61,6.4,8.6],bathroom:[6.4,5.61,8.56,8.6]};
const DOCK=[9.35,3.75], HALL=[6.2,4.9];
const SIM={pts:[],meta:[],seg:0,pos:[...DOCK],heading:0,running:false,trail:[[...DOCK]],timer:null};
function lanes(r){const [x0,z0,x1,z1]=R3[r],m=.35,out=[];let flip=false;
  for(let z=z0+m;z<=z1-m+1e-6;z+=.5){out.push(flip?[x1-m,z]:[x0+m,z],flip?[x0+m,z]:[x1-m,z]);flip=!flip}return out}
function plan(rooms,repeat){const pts=[[...SIM.pos]],meta=[{room:null,pass:0}];
  for(let p=1;p<=repeat;p++)for(const r of VAC_ROOMS.filter(x=>rooms.includes(x))){pts.push(HALL);meta.push({room:'hallway',pass:p,transit:true});
    for(const q of lanes(r)){pts.push(q);meta.push({room:r,pass:p})}}
  pts.push(HALL,DOCK);meta.push({room:'hallway',transit:true,home:true},{room:'studio',transit:true,home:true});return {pts,meta}}
function roomAt([x,z]){for(const k of VAC_ROOMS){const [a,b,c,d]=R3[k];if(x>=a&&x<=c&&z>=b&&z<=d)return k}return null}
function simStart(rooms){const v=S[VAC];
  if(v.status!=='Paused'){const p=plan(rooms,v.repeat);SIM.pts=p.pts;SIM.meta=p.meta;SIM.seg=0;SIM.trail=[[...SIM.pos]];v.cleaned=0}
  v.status='Cleaning';SIM.running=true;loopSim()}
function simDock(){const v=S[VAC];SIM.pts=[[...SIM.pos],HALL,DOCK];SIM.meta=[{},{transit:true,home:true},{transit:true,home:true}];SIM.seg=0;v.status='Returning';SIM.running=true;loopSim()}
function loopSim(){clearInterval(SIM.timer);let last=performance.now();
  SIM.timer=setInterval(()=>{const now=performance.now(),dt=(now-last)/1000;last=now;if(!SIM.running)return;
    const v=S[VAC];let dist=dt*1.6; // shortcut: sped-up demo speed; real robot position comes from HA
    while(dist>0&&SIM.seg<SIM.pts.length-1){const tg=SIM.pts[SIM.seg+1],dx=tg[0]-SIM.pos[0],dz=tg[1]-SIM.pos[1],L=Math.hypot(dx,dz);
      if(L>1e-4)SIM.heading=Math.atan2(dx,dz);
      const m=SIM.meta[SIM.seg+1]||{};
      if(L<=dist){SIM.pos=[...tg];dist-=L;SIM.seg++;SIM.trail.push([...tg]);if(!m.transit)v.cleaned+=L*.3}
      else{SIM.pos=[SIM.pos[0]+dx/L*dist,SIM.pos[1]+dz/L*dist];if(!m.transit)v.cleaned+=dist*.3;dist=0}}
    const m=SIM.meta[Math.min(SIM.seg+1,SIM.meta.length-1)]||{};
    const room=roomAt(SIM.pos)||v.room, pass=m.pass||v.pass;
    v.battery=Math.max(5,v.battery-dt*.15);
    if(SIM.seg>=SIM.pts.length-1){SIM.running=false;clearInterval(SIM.timer);const wasClean=v.status==='Cleaning';v.status='Docked';v.room=null;v.battery=Math.round(v.battery);
      if(wasClean)v.lastClean=`Just now · ${v.cleaned.toFixed(0)} m²`;update();toast(wasClean?'Robot finished and docked':'Robot docked');return}
    if(room!==v.room||pass!==v.pass){v.room=room;v.pass=pass;v.battery=Math.round(v.battery);update()}
    else{const h=document.getElementById('hud3d');if(h)h.lastElementChild.textContent=vacStatus()}
  },50)}

/* ---------- 3D (Three.js, lazy-loaded only when the 3D view opens) ---------- */
const loadScript=(u)=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s)});
async function mount3d(){
  const stage=document.getElementById('stage');
  try{
    T3.loading=T3.loading||(async()=>{await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js');
      await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js')})();
    await T3.loading;
    if(!T3.ready)build3d();
  }catch(err){if(stage)stage.innerHTML=`<div style="padding:16px">${fallbackPlan()}<p class="note">3D could not load on this device, so this is the flat plan.</p></div>`;return}
  if(view!=='3d'||!document.getElementById('stage'))return;
  document.getElementById('load3d')?.remove();
  document.getElementById('stage').prepend(T3.r.domElement);T3.resize();T3.sync();T3.start();
}
function build3d(){
  const THREE=window.THREE, tok=(n)=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(38,1,.1,100);
  const ctr=new THREE.OrbitControls(cam,r.domElement);ctr.enableDamping=true;ctr.maxPolarAngle=1.32;ctr.minDistance=4;ctr.maxDistance=26;
  const C=[4.9,0,3.6];
  const reset=()=>{cam.position.set(C[0]+4.5,11.5,C[2]+10.5);ctr.target.set(...C);ctr.update()};reset();
  scene.add(new THREE.HemisphereLight(0xffffff,0x8890a8,.95));const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(6,14,5);scene.add(sun);

  const floorM=new THREE.MeshStandardMaterial({roughness:.9}), wallM=new THREE.MeshStandardMaterial({roughness:.8});
  const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);
    gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.45)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
  const labels=[];
  for(const [id,[x0,z0,x1,z1]] of Object.entries(R3)){
    const w=x1-x0,d=z1-z0,f=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),floorM);f.position.set(x0+w/2,-.04,z0+d/2);scene.add(f);
    const h=id==='balcony'?.45:1.05,t=.08;
    [[w,t,x0+w/2,z0],[w,t,x0+w/2,z1],[t,d,x0,z0+d/2],[t,d,x1,z0+d/2]].forEach(([a,b,x,z])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(a,h,b),wallM);m.position.set(x,h/2,z);scene.add(m)});
    const c=document.createElement('canvas');c.width=512;c.height=128;const tex=new THREE.CanvasTexture(c);
    const lab=new THREE.Mesh(new THREE.PlaneGeometry(2.4,.6),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));
    lab.rotation.x=-Math.PI/2;lab.position.set(x0+w/2,.02,z0+d/2+(id==='living'?.9:id==='studio'?.3:0));scene.add(lab);labels.push({c,tex,name:roomName(id)});
  }
  const pick=[];
  const addPick=(obj,entity,r=.35)=>{const s=new THREE.Mesh(new THREE.SphereGeometry(r,8,8),new THREE.MeshBasicMaterial({visible:false}));s.position.copy(obj.position);s.userData.entity=entity;scene.add(s);pick.push(s)};
  // lights: [entity, x, z, height, type]
  const LP=[['light.living_room_light_1',2.0,2.1,1.9,'ceil'],['light.living_room_light_2',4.4,2.1,1.9,'ceil'],['light.living_room_lamp',.55,.55,1.35,'floor'],
    ['light.tv_lights',2.1,3.98,.75,'strip'],['light.studio_light',8.0,2.1,1.9,'ceil'],['light.studio_lamp',9.35,.6,1.35,'floor'],
    ['light.bedroom_ceiling',2.0,6.4,1.9,'ceil'],['light.bedside_lamp',.45,5.25,.7,'table'],['light.bedside_lamp_2',.45,7.65,.7,'table'],
    ['light.kitchen_ceiling',5.15,7.1,1.9,'ceil'],['light.balcony_lights',5.35,-.7,1.1,'ceil']];
  const L3=LP.map(([id,x,z,y,type])=>{
    const orbG=type==='strip'?new THREE.BoxGeometry(1.25,.06,.06):new THREE.SphereGeometry(type==='ceil'?.16:.12,20,16);
    const orb=new THREE.Mesh(orbG,new THREE.MeshBasicMaterial());orb.position.set(x,y,z);scene.add(orb);
    if(type==='floor'||type==='table'){const st=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,y,8),wallM);st.position.set(x,y/2,z);scene.add(st)}
    if(type==='ceil'){const st=new THREE.Mesh(new THREE.CylinderGeometry(.01,.01,.5,6),wallM);st.position.set(x,y+.3,z);scene.add(st)}
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,depthWrite:false}));halo.position.copy(orb.position);halo.scale.set(1.1,1.1,1);scene.add(halo);
    const pool=new THREE.Mesh(new THREE.PlaneGeometry(3.4,3.4),new THREE.MeshBasicMaterial({map:glowTex,transparent:true,depthWrite:false}));pool.rotation.x=-Math.PI/2;pool.position.set(x,.015,z);scene.add(pool);
    addPick(orb,id,type==='strip'?.5:.38);return {id,orb,halo,pool}});
  // TV + soundbar
  const dark=new THREE.MeshStandardMaterial({color:0x1b1d24,roughness:.4});
  const tv=new THREE.Mesh(new THREE.BoxGeometry(1.35,.78,.05),dark);tv.position.set(2.1,.95,4.05);scene.add(tv);
  const bench=new THREE.Mesh(new THREE.BoxGeometry(1.8,.45,.4),wallM);bench.position.set(2.1,.22,3.95);scene.add(bench);
  const bar=new THREE.Mesh(new THREE.BoxGeometry(.9,.08,.1),dark);bar.position.set(2.1,.5,3.85);scene.add(bar);
  // doors: [entity, hinge x, z, width, axis, open direction]
  const doorM=new THREE.MeshStandardMaterial({roughness:.6});
  const D3=[['binary_sensor.balcony_door',4.25,0,.85,'x',1],['binary_sensor.main_door',8.56,4.45,.9,'z',-1]].map(([id,x,z,w,ax,dir])=>{
    const g=new THREE.Group();g.position.set(x,0,z);const p=new THREE.Mesh(new THREE.BoxGeometry(ax==='x'?w:.05,1.0,ax==='x'?.05:w),doorM.clone());
    p.position.set(ax==='x'?w/2:0,.5,ax==='x'?0:w/2);g.add(p);scene.add(g);return {id,g,p,ax,dir,cur:0}});
  // presence zones (Studio) — positions are placeholders until zones are named
  const Z3=[['binary_sensor.studio_presence_zone_1',9.0,1.1],['binary_sensor.studio_presence_zone_2',8.2,3.3],['binary_sensor.studio_presence_zone_3',6.9,3.4]].map(([id,x,z])=>{
    const m=new THREE.Mesh(new THREE.CircleGeometry(.6,40),new THREE.MeshBasicMaterial({transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.set(x,.02,z);scene.add(m);addPick(m,id,.6);return {id,m}});
  // appliances
  const white=new THREE.MeshStandardMaterial({color:0xf2f3f5,roughness:.5});
  const washer=new THREE.Mesh(new THREE.BoxGeometry(.6,.85,.6),white);washer.position.set(6.0,.43,8.22);scene.add(washer);addPick(washer,'sensor.washer',.5);
  const rice=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.2,20),white);rice.position.set(4.3,.95,8.3);scene.add(rice);
  const counter=new THREE.Mesh(new THREE.BoxGeometry(1.4,.85,.55),wallM);counter.position.set(4.7,.42,8.27);scene.add(counter);addPick(rice,'switch.rice_cooker',.35);
  const hub=new THREE.Mesh(new THREE.BoxGeometry(.22,.08,.22),white);hub.position.set(5.0,.6,4.32);scene.add(hub);
  [[5.9,6.0],[.4,3.8],[9.5,2.0]].forEach(([x,z])=>{const e=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.05,16),dark);e.position.set(x,.75,z);scene.add(e)});
  // robot + dock + cleaned trail
  const robot=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.09,32),dark);body.position.y=.06;robot.add(body);
  const turret=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.04,20),new THREE.MeshBasicMaterial());turret.position.set(0,.12,.06);robot.add(turret);scene.add(robot);
  const dock=new THREE.Mesh(new THREE.BoxGeometry(.4,.25,.15),dark);dock.position.set(DOCK[0],.13,DOCK[1]+.28);scene.add(dock);
  const MAXT=4000,tpos=new Float32Array(MAXT*3),tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.BufferAttribute(tpos,3));
  const trail=new THREE.Line(tg,new THREE.LineBasicMaterial({transparent:true,opacity:.8}));scene.add(trail);

  const col=(c)=>new THREE.Color(c);
  T3.retheme=()=>{floorM.color=col(tok('--floor'));wallM.color=col(tok('--wall3d'));doorM.color=col(tok('--wall3d'));
    turret.material.color=col(tok('--accent'));trail.material.color=col(tok('--ok'));
    labels.forEach(({c,tex,name})=>{const g=c.getContext('2d');g.clearRect(0,0,512,128);g.fillStyle=tok('--label3d');g.font='600 54px -apple-system, BlinkMacSystemFont, Inter, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(name,256,64);tex.needsUpdate=true});
    T3.sync()};
  T3.sync=()=>{
    for(const l of L3){const e=S[l.id],c=col(glow(e)||tok('--on-warm')),a=e.bri/100;
      l.orb.material.color=e.on?c:col(tok('--fg-3'));l.halo.visible=l.pool.visible=e.on;
      l.halo.material.color=c;l.halo.material.opacity=.5+.5*a;l.pool.material.color=c;l.pool.material.opacity=.25+.5*a}
    for(const d of D3){d.target=S[d.id].on?-1.2*d.dir:0;d.p.material.color=col(S[d.id].on?tok('--warn'):tok('--wall3d'))}
    for(const z of Z3){z.m.material.color=col(tok('--accent'));z.m.material.opacity=S[z.id].on?.42:.1}
  };
  const resize=()=>{const s=r.domElement.parentElement;if(!s)return;const w=s.clientWidth,h=s.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()};
  addEventListener('resize',resize);
  let raf=0;
  const frame=()=>{raf=requestAnimationFrame(frame);ctr.update();
    for(const d of D3){d.cur+=(d.target-d.cur)*.12;d.g.rotation.y=d.ax==='x'?d.cur:-d.cur}
    robot.position.set(SIM.pos[0],0,SIM.pos[1]);robot.rotation.y=SIM.heading;
    const n=Math.min(SIM.trail.length,MAXT-1);for(let i=0;i<n;i++){tpos[i*3]=SIM.trail[i][0];tpos[i*3+1]=.03;tpos[i*3+2]=SIM.trail[i][1]}
    tpos[n*3]=SIM.pos[0];tpos[n*3+1]=.03;tpos[n*3+2]=SIM.pos[1];tg.attributes.position.needsUpdate=true;tg.setDrawRange(0,n+1);
    r.render(scene,cam)};
  T3.start=()=>{if(!raf)frame()};T3.stop=()=>{cancelAnimationFrame(raf);raf=0};
  // tap to toggle (ignore drags)
  const ray=new THREE.Raycaster(),v2=new THREE.Vector2();let down=null;
  r.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});

    const b=r.domElement.getBoundingClientRect();v2.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);ray.setFromCamera(v2,cam);
    const hit=ray.intersectObjects(pick)[0];if(!hit)return;const id=hit.object.userData.entity,en=S[id];
    if(id==='sensor.washer'){toast(`Washer: ${en.program} · done ${en.finish}`);return}

    en.on=!en.on;update();toast(`${en.name} ${id.includes('presence')?(en.on?'occupied (demo)':'clear (demo)'):en.on?'on':'off'}`)});
  T3.r=r;T3.resize=resize;T3.reset=reset;T3.ready=true;T3.retheme();

/* ---------- actions (each becomes a hass.callService call after deployment) ---------- */
const scene={
 morning:()=>{set('light.bedroom_ceiling',1,60,4000);set('light.bedside_lamp',1,80,4000);set('light.kitchen_ceiling',1,100,4000);ids('climate.').forEach(k=>S[k].preset='Home')},
 focus:()=>{set('light.studio_light',1,100,4000);set('light.studio_lamp',1,80,4000)},
 movie:()=>{set('light.living_room_light_1',0);set('light.living_room_light_2',0);set('light.living_room_lamp',1,20);set('light.tv_lights',1,60);S['media_player.soundbar'].on=true},
 night:()=>{ids('light.').forEach(k=>S[k].on=false);set('light.bedside_lamp',1,10,2200)},
 away:()=>{ids('light.').forEach(k=>S[k].on=false);S['switch.rice_cooker'].on=false;ids('climate.').forEach(k=>S[k].preset='Away');simStart(S[VAC].rooms.length?S[VAC].rooms:VAC_ROOMS)},
};
function set(id,on,bri,k){const e=S[id];e.on=!!on;if(bri)e.bri=bri;if(k&&e.kelvin)e.kelvin=k}

document.addEventListener('click',e=>{
  const wrap=document.getElementById('sheetWrap');if(e.target===wrap){closeSheet();return}
  const b=e.target.closest('button,a[data-jump]');if(!b)return;
  const d=b.dataset,v=S[VAC];
  const keepOff=()=>toast('Vacation mode keeps lights and plugs off');
  if(LIVE.on&&LIVE.click(d))return;
  if(d.vdstart){VD.startMode=d.vdstart;drawSheet()}
  else if(d.vdend){VD.endMode=d.vdend;drawSheet()}
  else if(d.vdevery){VD.robotEvery=+d.vdevery;drawSheet()}
  else if(d.vdflag){VD[d.vdflag]=!VD[d.vdflag];drawSheet()}
  else if(d.vdh){VD.preheatH=Math.min(12,Math.max(1,VD.preheatH+ +d.vdh));drawSheet()}
  else if('vdgo' in d){startVacation()}
  else if('vacEnd' in d){endVac()}
  else if('vacNow' in d){S[VAC_ID].start=today();activateVac();update()}
  else if(d.toggle){if(blocked(d.toggle))return keepOff();S[d.toggle].on=!S[d.toggle].on;update()}
  else if(d.adjust){if(blocked(d.adjust))return keepOff();openSheet(d.adjust,b)}
  else if('close' in d){closeSheet()}
  else if('sheetToggle' in d){S[sheetId].on=!S[sheetId].on;update()}
  else if(d.preset){const en=S[sheetId];en.kelvin=+d.preset;en.on=true;update()}
  else if(d.swatch){const en=S[sheetId];en.rgb=d.swatch;en.on=true;update()}
  else if(d.all==='on'&&vacOn()){keepOff()}
  else if(d.scene==='vacation'){const V=S[VAC_ID];if(V.on||V.scheduled)toast('Vacation is already set. Use the banner to end it');else openVac(b)}
  else if(d.all){ids('light.',d.room==='*'?null:d.room).forEach(k=>S[k].on=d.all==='on');update();toast(`${d.room==='*'?'All lights':roomName(d.room)+' lights'} ${d.all}`)}
  else if(d.scene){if(vacOn())return toast('End vacation mode to use scenes');scene[d.scene]();update();toast(`${SCENES.find(s=>s[0]===d.scene)[1]} scene on`)}
  else if(d.step){const c=S[d.step];c.target=Math.min(25,Math.max(5,c.target+ +d.d));c.preset='Manual';update()}
  else if(d.tado){ids('climate.').forEach(k=>S[k].preset=d.tado==='boost'?'Boost · 30 min':'Off');update();toast(d.tado==='boost'?'Boosting all rooms':'Heating off in all rooms')}
  else if(d.vroom){if(v.status==='Cleaning')return toast('Pause or dock the robot to change rooms');v.rooms=v.rooms.includes(d.vroom)?v.rooms.filter(r=>r!==d.vroom):[...v.rooms,d.vroom];if(v.status==='Paused')v.status='Docked';update()}
  else if(d.fan){v.fan=d.fan;update();toast(`Suction: ${d.fan}`)}
  else if(d.repeat){if(v.status==='Cleaning')return toast('Pause or dock the robot to change passes');v.repeat=+d.repeat;if(v.status==='Paused')v.status='Docked';update()}
  else if(d.vac==='start'){simStart(v.rooms);update();toast(`Cleaning ${v.rooms.map(roomName).join(', ')} · ${v.repeat}× · ${v.fan}`)}
  else if(d.vac==='all'){v.rooms=[...VAC_ROOMS];v.status='Docked';simStart(v.rooms);update();toast('Cleaning the whole flat')}
  else if(d.vac==='pause'){SIM.running=false;v.status='Paused';update();toast('Robot paused')}
  else if(d.vac==='dock'){simDock();update();toast('Robot returning to dock')}
  else if(d.announce){toast(`Announcing on ${S[d.announce].name}`)}
  else if(d.themeSet){applyTheme(d.themeSet);render()}
  else if('themeCycle' in d){applyTheme({auto:'light',light:'dark',dark:'auto'}[theme]);render();toast(`Appearance: ${theme}`)}
  else if(d['3d']==='reset'){T3.reset?.()}
  else if(d.jump){setTimeout(()=>document.getElementById('room-'+d.jump)?.scrollIntoView({behavior:'smooth'}),60)}
});
document.addEventListener('input',e=>{

  else if(t.id==='sh-rgb'){en.rgb=t.value;en.on=true;document.getElementById('shRV').textContent=en.rgb}

/* ---------- live mode: inside Home Assistant (Webpage dashboard, same origin) read and drive real entities ---------- */
const LIVE=(()=>{
  let host=null;try{if(parent!==window)host=parent.document.querySelector('home-assistant')}catch(e){}
  const L={on:!!host?.hass,snap:{},last:null,wx:null};if(!L.on)return L;
  const TPL=JSON.parse(JSON.stringify(S)); // which mock tiles have warmth / colour controls
  const seen={};const H=()=>host.hass, st=(id)=>(seen[id]=H().states[id]), ok=(s)=>!!s&&!['unavailable','unknown'].includes(s.state);
  const call=(dom,svc,data)=>H().callService(dom,svc,data).catch(err=>toast('Home Assistant: '+(err.message||err.code||'error')));
  const hex=(c)=>'#'+c.map(x=>x.toString(16).padStart(2,'0')).join(''), rgbOf=(h)=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const ago=(t)=>{const m=Math.round((Date.now()-new Date(t))/6e4);return m<1?'just now':m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} h ago`:`${Math.round(m/1440)} d ago`};
  const rk=(r)=>r==='living'?'living_room':r;
  const FAN={gentle:'Gentle',quiet:'Quiet',balanced:'Balanced',turbo:'Turbo',max:'Max',max_plus:'Max+'}, FANR=Object.fromEntries(Object.entries(FAN).map(([a,b])=>[b,a]));
  const WASH={run:'Running',finished:'Finished',ready:'Ready',inactive:'Off',pause:'Paused',delayedstart:'Delayed start',actionrequired:'Needs attention',aborting:'Stopping',error:'Error'};
  const VROOM={Study:'studio',Bathroom:'bathroom',Hall:'hallway','Living room':'living',Kitchen:'kitchen',Bedroom:'bedroom'};
  const BAT={'event.bedroom_dual_button':'sensor.bedroom_button_battery','event.bedroom_scroll_wheel':'sensor.bedroom_wheel_battery','event.living_room_scroll_wheel':'sensor.living_room_wheel_battery','event.studio_scroll_wheel':'sensor.studio_wheel_battery'};
  const num=(id)=>{const s=st(id);return ok(s)?+s.state:null};
  const snapOf=(e)=>({on:e.on,bri:e.bri,kelvin:e.kelvin,rgb:e.rgb,target:e.target,preset:e.preset});
  L.pull=()=>{
    if(H().states===L.last)return false;L.last=H().states;
    if(Object.keys(seen).length&&Object.entries(seen).every(([id,o])=>H().states[id]===o))return false;
    for(const [id,e] of Object.entries(S)){const d=id.split('.')[0],s=st(id);
      if(d==='light'||d==='switch'){e.available=ok(s);if(!e.available){e.on=false;continue}
        e.on=s.state==='on';const a=s.attributes,m=a.supported_color_modes||[];
        if(d==='light'){if(a.brightness!=null)e.bri=Math.max(1,Math.round(a.brightness/2.55));e.nodim=m.length===1&&m[0]==='onoff';
          if(TPL[id].kelvin&&m.includes('color_temp'))e.kelvin=a.color_temp_kelvin||e.kelvin;else delete e.kelvin;
          if(TPL[id].rgb&&m.some(x=>['hs','rgb','xy','rgbw','rgbww'].includes(x))){if(a.rgb_color)e.rgb=hex(a.rgb_color)}else delete e.rgb}
        L.snap[id]=snapOf(e)}
      else if(d==='binary_sensor'){e.available=ok(s);e.on=s?.state==='on';if(s)e.last=ago(s.last_changed)}
      else if(d==='climate'){e.available=ok(s);if(!e.available)continue;const a=s.attributes;
        e.cur=+(a.current_temperature??e.cur);e.target=+(a.temperature??e.target);const h=num(`sensor.${id.slice(8)}_humidity`);if(h!=null)e.hum=Math.round(h);
        e.preset=s.state==='off'?'Off':'Heating';L.snap[id]=snapOf(e)}
      else if(d==='media_player'){e.available=ok(s);if(s)e.on=!['off','standby'].includes(s.state)}}
    const aq=S['sensor.air_quality_monitor'];aq.available=num('sensor.air_quality_pm25')!=null;
    if(aq.available)Object.assign(aq,{pm25:num('sensor.air_quality_pm25'),co2:num('sensor.air_quality_co2'),hum:num('sensor.air_quality_humidity'),temp:num('sensor.air_quality_temperature'),rating:(st('sensor.air_quality_rating')?.state||'').replace('_',' ')});
    const lx=S['sensor.studio_illuminance'];lx.available=num('sensor.studio_illuminance')!=null;if(lx.available)lx.lux=Math.round(num('sensor.studio_illuminance'));
    const w=S['sensor.washer'],ws=st('sensor.washer_operation_state');w.available=ok(ws);
    if(w.available){w.status=WASH[ws.state]||ws.state;const ft=st('sensor.washer_finish_time');w.finish=ok(ft)?new Date(ft.state).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—';
      w.progress=num('sensor.washer_program_progress')||0;const pr=[st('select.kitchen_washing_machine_active_program'),st('select.kitchen_washing_machine_selected_program')].find(ok);
      w.program=pr?pr.state.replace('laundry_care_washer_program_','').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()):'No program';w.detail=ws.state==='run'?`${w.progress}% done`:'Siemens WG44B2040'}
    const v=S[VAC],vs=st(VAC);v.available=ok(vs);
    if(v.available){v.status={docked:'Docked',cleaning:'Cleaning',returning:'Returning',paused:'Paused',idle:'Idle',error:'Error'}[vs.state]||vs.state;
      v.battery=Math.round(num('sensor.studio_roborock_battery')??v.battery);const f=st('input_select.robot_suction');if(ok(f))v.fan=FAN[f.state]||f.state;
      v.rooms=VAC_ROOMS.filter(r=>st('input_boolean.robot_room_'+rk(r))?.state==='on');v.repeat=Math.round(num('input_number.robot_passes')||1);
      const cr=st('sensor.studio_roborock_current_room');v.room=ok(cr)?VROOM[cr.state]||null:null;v.pass=1;
      const le=st('sensor.studio_roborock_last_clean_end'),ar=num('sensor.studio_roborock_cleaning_area');if(ok(le))v.lastClean=ago(le.state)+(ar?` · ${Math.round(ar)} m²`:'')}
    for(const [ev,b] of Object.entries(BAT)){const p=num(b);S[ev].available=p!=null;S[ev].last=p!=null?`battery ${p}%`:'—'}
    const V=S[VAC_ID],vm=st(VAC_ID);
    if(ok(vm)){const dt=(x)=>{const s=st(x);return ok(s)?s.state.slice(0,10):null},on=(x)=>st('input_boolean.vacation_'+x)?.state==='on';
      Object.assign(V,{on:vm.state==='on',scheduled:false,start:dt('input_datetime.vacation_start')||today(),end:on('open_ended')?null:dt('input_datetime.vacation_end'),
        robotEvery:Math.round(num('input_number.vacation_robot_every_days')||3),robotTime:(st('input_datetime.vacation_robot_time')?.state||'11:00').slice(0,5),
        alerts:on('security_alerts'),preheat:on('preheat'),preheatH:Math.round(num('input_number.vacation_preheat_hours')||3),sim:on('presence_simulation'),humidity:on('humidity_alerts')})}
    const wx=st(Object.keys(H().states).find(k=>k.startsWith('weather.')));
    L.wx=ok(wx)?{t:Math.round(wx.attributes.temperature),c:wx.state.replace(/[-_]/g,' ').replace(/^./,c=>c.toUpperCase())}:null;
    return true};
  // send what a click changed (lights, plugs, heating) by diffing against the last state Home Assistant reported
  L.push=()=>{for(const [id,p] of Object.entries(L.snap)){const e=S[id],d=id.split('.')[0];if(!e.available)continue;
      if(d==='climate'){if(e.target!==p.target)call('climate','set_temperature',{entity_id:id,temperature:e.target});
        if(e.preset!==p.preset)call('climate','set_hvac_mode',{entity_id:id,hvac_mode:/Off|Frost/.test(e.preset)?'off':'heat'})}
      else if(!e.on&&p.on)call(d,'turn_off',{entity_id:id});
      else if(e.on&&(!p.on||e.bri!==p.bri||e.kelvin!==p.kelvin||e.rgb!==p.rgb)){const data={entity_id:id};
        if(d==='light'&&!e.nodim){data.brightness_pct=e.bri;if(e.rgb&&e.rgb!==p.rgb)data.rgb_color=rgbOf(e.rgb);else if(e.kelvin&&(e.kelvin!==p.kelvin||!p.on))data.color_temp_kelvin=e.kelvin}
        call(d,'turn_on',data)}
      L.snap[id]=snapOf(e)}};
  const ib=(x,v)=>call('input_boolean',v?'turn_on':'turn_off',{entity_id:'input_boolean.'+x});
  // actions that are services in Home Assistant, not light/plug changes; returns true when handled
  L.click=(d)=>{const v=S[VAC];
    if(d.scene&&d.scene!=='vacation'){if(vacOn())return toast('End vacation mode to use scenes'),true;
      d.scene==='away'?call('script','turn_on',{entity_id:'script.away'}):call('scene','turn_on',{entity_id:'scene.'+d.scene});toast(`${SCENES.find(s=>s[0]===d.scene)[1]} scene on`);return true}
    if(d.vroom){ib('robot_room_'+rk(d.vroom),!v.rooms.includes(d.vroom));return true}
    if(d.fan){call('input_select','select_option',{entity_id:'input_select.robot_suction',option:FANR[d.fan]||d.fan.toLowerCase()});toast(`Suction: ${d.fan}`);return true}
    if(d.repeat){call('input_number','set_value',{entity_id:'input_number.robot_passes',value:+d.repeat});return true}
    if(d.vac==='start'){call('script','turn_on',{entity_id:'script.robot_clean_selected_rooms'});toast(`Cleaning ${v.rooms.map(roomName).join(', ')} · ${v.repeat}× · ${v.fan}`);return true}
    if(d.vac){call('vacuum',{all:'start',pause:'pause',dock:'return_to_base'}[d.vac],{entity_id:VAC});toast({all:'Cleaning the whole flat',pause:'Robot paused',dock:'Robot returning to dock'}[d.vac]);return true}
    if(d.announce){toast('Echo Dots are not connected to Home Assistant yet');return true}
    if('vdgo' in d){const s=VD.startMode==='now'?today():VD.start,dated=VD.endMode==='date';
      call('input_datetime','set_datetime',{entity_id:'input_datetime.vacation_start',date:s});if(dated)call('input_datetime','set_datetime',{entity_id:'input_datetime.vacation_end',date:VD.end});
      call('input_number','set_value',{entity_id:'input_number.vacation_robot_every_days',value:VD.robotEvery});call('input_datetime','set_datetime',{entity_id:'input_datetime.vacation_robot_time',time:VD.robotTime+':00'});
      call('input_number','set_value',{entity_id:'input_number.vacation_preheat_hours',value:VD.preheatH});
      ib('vacation_open_ended',!dated);ib('vacation_security_alerts',VD.alerts);ib('vacation_preheat',VD.preheat&&dated);ib('vacation_presence_simulation',VD.sim);ib('vacation_humidity_alerts',VD.humidity);
      closeSheet();if(s>today())toast(`Vacation saved from ${fmtD(s)}`);else{ib('vacation_mode',true);toast('Vacation mode on')}return true}
    if('vacEnd' in d){ib('vacation_mode',false);toast('Vacation mode off');return true}
    if('vacNow' in d){ib('vacation_mode',true);return true}
    return false};
  let busy=0;addEventListener('pointerdown',()=>busy=Infinity,true);addEventListener('pointerup',()=>busy=Date.now()+600,true);addEventListener('pointercancel',()=>busy=0,true);
  // shortcut: polls the parent's hass object once a second instead of subscribing; fine for one dashboard, switch to subscribeEntities if it ever feels laggy.
  setInterval(()=>{if(Date.now()>busy&&L.pull()){render();if(T3.ready)T3.sync();if(sheetId&&sheetId!=='vacation')drawSheet()}},1000);
  L.pull();return L;
})();
