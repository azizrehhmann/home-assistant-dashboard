<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aziz Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: glass sidebar (desktop) / floating glass tab bar (phone) over a soft colour-field wallpaper; content is a grid of frosted cards. */
:root{
  --wall-1:#cfe0ff; --wall-2:#ffd9c7; --wall-3:#d4f3e4; --wall-4:#efe3ff; --wall-base:#eef1f7;
  --glass:rgba(255,255,255,.48); --glass-strong:rgba(255,255,255,.70); --glass-edge:rgba(255,255,255,.85);
  --glass-shadow:0 10px 30px rgba(40,50,90,.12), 0 1px 2px rgba(40,50,90,.08);
  --fg:#141824; --fg-2:#4a5266; --fg-3:#7c8499; --hair:rgba(20,24,36,.08); --scrim:rgba(20,24,40,.22);
  --accent:#0a84ff; --on-warm:#ffb340;
  --ok:#22a55a; --warn:#e08a00; --bad:#e5484d; --cool:#30b0c7;
  --floor:#f3efe8; --wall3d:#d9dde8; --label3d:#4a5266;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --font-d: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  --r-lg:26px; --r-md:20px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --wall-1:#1d2b5c; --wall-2:#4a2337; --wall-3:#123b36; --wall-4:#2c1f4f; --wall-base:#0b0d16;
  --glass:rgba(38,42,58,.46); --glass-strong:rgba(58,63,84,.66); --glass-edge:rgba(255,255,255,.14);
  --glass-shadow:0 10px 30px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  --fg:#f2f4fa; --fg-2:#b5bccd; --fg-3:#8189a0; --hair:rgba(255,255,255,.09); --scrim:rgba(0,0,0,.45);
  --accent:#409cff; --on-warm:#ffc061;
  --ok:#3ccf7a; --warn:#ffb020; --bad:#ff6369; --cool:#5ad0e6;
  --floor:#2a2f40; --wall3d:#454c63; --label3d:#b5bccd; color-scheme:dark }}
:root[data-theme="dark"]{
  --wall-1:#1d2b5c; --wall-2:#4a2337; --wall-3:#123b36; --wall-4:#2c1f4f; --wall-base:#0b0d16;
  --glass:rgba(38,42,58,.46); --glass-strong:rgba(58,63,84,.66); --glass-edge:rgba(255,255,255,.14);
  --glass-shadow:0 10px 30px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  --fg:#f2f4fa; --fg-2:#b5bccd; --fg-3:#8189a0; --hair:rgba(255,255,255,.09); --scrim:rgba(0,0,0,.45);
  --accent:#409cff; --on-warm:#ffc061;
  --ok:#3ccf7a; --warn:#ffb020; --bad:#ff6369; --cool:#5ad0e6;
  --floor:#2a2f40; --wall3d:#454c63; --label3d:#b5bccd; color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:var(--font);color:var(--fg);background:var(--wall-base);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4}
body::after{content:"";position:fixed;inset:-10%;z-index:-1;background:
  radial-gradient(40% 35% at 15% 20%,var(--wall-1),transparent 70%),
  radial-gradient(35% 35% at 85% 15%,var(--wall-2),transparent 70%),
  radial-gradient(45% 40% at 70% 85%,var(--wall-3),transparent 70%),
  radial-gradient(35% 35% at 20% 90%,var(--wall-4),transparent 70%), var(--wall-base)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.sm{width:14px;height:14px}

.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);
  border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-edge);border-radius:var(--r-lg)}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;max-width:1440px;margin:0 auto;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(24px + env(safe-area-inset-top,0px));height:calc(100vh - 48px);display:flex;flex-direction:column;gap:4px;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-family:var(--font-d);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand span{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#7d5cff);color:#fff}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;color:var(--fg-2);font-weight:500;text-decoration:none}
.nav:hover{background:var(--hair)}
.nav[aria-current="page"]{background:var(--glass-strong);color:var(--fg);box-shadow:inset 0 1px 0 var(--glass-edge),0 2px 8px rgba(0,0,0,.06)}
.side .foot{margin-top:auto;padding:10px 6px;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--fg-3)}
.side .foot .seg{width:100%}.side .foot .seg button{flex:1}
main{min-width:0;display:flex;flex-direction:column;gap:22px;padding-bottom:40px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{margin:0;font-family:var(--font-d);font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--fg-2)}
.top .row{align-items:center}
.wx{display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:18px}
.wx b{font-family:var(--font-d);font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wx small{display:block;color:var(--fg-2);font-size:12px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.phone-only{display:none!important}

h2{margin:0 0 12px;font-family:var(--font-d);font-size:20px;font-weight:650;letter-spacing:-.015em;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
h2 .meta{font-size:13px;font-weight:500;color:var(--fg-3);font-family:var(--font)}
h2 .end{margin-left:auto}
.sec{min-width:0}

/* segmented control */
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--hair);gap:2px;font-family:var(--font)}
.seg button{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--fg-2);white-space:nowrap;transition:background .2s}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.12),inset 0 1px 0 var(--glass-edge)}
.seg.full{display:flex;width:100%}.seg.full button{flex:1;padding-inline:4px}

/* chips + scenes */
.row{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:500;min-width:0}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--fg-3);flex:none}
.chip.ok .dot{background:var(--ok)} .chip.warn .dot{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 25%,transparent)}
.chip.bad .dot{background:var(--bad)}
.chip small{color:var(--fg-3);font-weight:400}
.scene{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;font-weight:600;transition:transform .15s}
.scene:active{transform:scale(.96)}
.scene .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{--glow:var(--on-warm);position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r-md);min-height:118px;min-width:0;transition:background .25s,transform .15s}
.tile .hit{position:absolute;inset:0;border-radius:inherit}
.tile .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--hair);color:var(--fg-2);transition:all .25s;pointer-events:none}
.tile .nm{font-weight:600;font-size:14.5px;line-height:1.25;pointer-events:none;overflow-wrap:anywhere}
.tile .st{font-size:13px;color:var(--fg-3);pointer-events:none;font-variant-numeric:tabular-nums}
.tile .st button{pointer-events:auto;color:var(--fg)}
.tile.on{background:linear-gradient(160deg,color-mix(in srgb,var(--glow) 34%,transparent),var(--glass) 72%)}
.tile.on .ico{background:var(--glow);color:#2b2111;box-shadow:0 0 18px color-mix(in srgb,var(--glow) 70%,transparent)}
.tile.on.rgb .ico{color:#fff}
.tile.on .st{color:var(--fg-2)}
.tile.off-line{opacity:.6}
.tile.off-line .st{color:var(--bad)}
.tile:active{transform:scale(.98)}
.tile input[type=range]{position:relative;z-index:1;width:100%;margin-top:auto;accent-color:var(--glow);height:22px}
.tile .adj{position:absolute;z-index:2;top:10px;right:10px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--hair);color:var(--fg-2)}
.tile .adj:hover{background:var(--glass-strong)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{padding:18px;min-width:0}
.card.wide{grid-column:1/-1}
.card h3{margin:0;font-family:var(--font-d);font-size:17px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--hair);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span:first-child{display:flex;align-items:center;gap:10px;color:var(--fg-2);min-width:0}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);margin:16px 0 8px;display:flex;justify-content:space-between}
.lbl b{letter-spacing:0;text-transform:none;color:var(--fg-2);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--hair);color:var(--fg-2);white-space:nowrap}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.cool{color:var(--cool);background:color-mix(in srgb,var(--cool) 16%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--glass-edge);font-weight:600;font-size:14px;box-shadow:inset 0 1px 0 var(--glass-edge)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.small{padding:6px 12px;font-size:13px}
.tvb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn:active{transform:scale(.97)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--hair);color:var(--fg-2);border:1px solid transparent}
.tog[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}

/* room summary */
.room{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-md);text-align:left;min-width:0;color:inherit;text-decoration:none}
.room .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.room b{font-family:var(--font-d);font-size:16px;font-weight:650}
.room .r2{display:flex;flex-wrap:wrap;gap:6px}

/* climate */
.temp{font-family:var(--font-d);font-size:46px;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;margin:14px 0 4px}
.temp sup{font-size:20px;font-weight:400;vertical-align:top;margin-left:2px}
.stepper{display:flex;align-items:center;gap:10px;margin-top:12px}
.stepper button{width:38px;height:38px;border-radius:50%;background:var(--glass-strong);border:1px solid var(--glass-edge);font-size:20px;font-weight:500}
.stepper output{flex:1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

/* ring */
.ring{width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--hair) 0)}
.ring>div{width:96px;height:96px;border-radius:50%;background:var(--glass-strong);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--font-d);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;display:block}
.ring small{font-size:11px;color:var(--fg-3)}
.flex{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:var(--hair);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:inherit}

/* presence zones */
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.zone{border-radius:14px;padding:12px 8px;text-align:center;font-size:12.5px;font-weight:600;background:var(--hair);color:var(--fg-3);transition:all .3s}
.zone.on{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}

/* 3D */
.stage{position:relative;height:min(62vh,560px);min-height:360px;border-radius:var(--r-lg);overflow:hidden}
.stage canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.stage .hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;pointer-events:none}
.stage .hud>*{pointer-events:auto}
.stage .load{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg-3);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--fg-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.plan{width:100%;height:auto;display:block}
.plan .rm{fill:var(--hair);stroke:var(--fg-3);stroke-width:2;transition:fill .4s}
.plan .rm.lit{fill:color-mix(in srgb,var(--on-warm) 32%,transparent)}
.plan text{fill:var(--fg-2);font:600 13px var(--font)}

/* sheet */
[hidden]{display:none!important} /* author display rules (e.g. .sheet-wrap flex) must not unhide */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{width:min(460px,100%);padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:30px;max-height:90vh;overflow:auto;background:var(--glass-strong)}
.sheet .hd{display:flex;align-items:center;gap:12px}
.sheet .hd .ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--glow,var(--hair));color:#2b2111;box-shadow:0 0 22px color-mix(in srgb,var(--glow,transparent) 70%,transparent)}
.sheet .hd .ico.off{background:var(--hair);color:var(--fg-2);box-shadow:none}
.sheet .hd b{display:block;font-family:var(--font-d);font-size:19px}
.sheet .hd small{color:var(--fg-3)}
.sw{margin-left:auto;width:52px;height:32px;border-radius:99px;background:var(--hair);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-pressed="true"]{background:var(--ok)}.sw[aria-pressed="true"]::after{transform:translateX(20px)}
.big{-webkit-appearance:none;appearance:none;width:100%;height:44px;border-radius:16px;background:var(--hair);outline-offset:3px;cursor:pointer}
.big.bri{background:linear-gradient(90deg,var(--hair),var(--glow,var(--on-warm)))}
.big.kel{background:linear-gradient(90deg,#ff9329,#ffce96 45%,#ecf3ff 100%)}
.big.hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.big::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:38px;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.big::-moz-range-thumb{width:30px;height:38px;border-radius:12px;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.swatches button[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}

/* tab bar (phone) */
.tabbar{display:none}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;pointer-events:none;transition:all .3s;z-index:70;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* vacation */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 16px;border-radius:22px;background:linear-gradient(120deg,color-mix(in srgb,#ff375f 20%,transparent),var(--glass) 62%)}
.banner .bico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ff375f;color:#fff;flex:none}
.banner .btxt{flex:1;min-width:180px}.banner b{display:block;font-family:var(--font-d);font-size:16px}.banner small{color:var(--fg-2)}
.vin{font:inherit;color:var(--fg);background:var(--hair);border:1px solid var(--glass-edge);border-radius:12px;padding:9px 12px;margin-top:8px;width:100%}
.flag{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--hair)}
.flag>div{flex:1;min-width:0;font-weight:600;font-size:14.5px}.flag small{display:block;color:var(--fg-3);font-size:12.5px;font-weight:400}
.mini{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13.5px;color:var(--fg-2)}
.mini button{width:30px;height:30px;border-radius:50%;background:var(--glass-strong);border:1px solid var(--glass-edge);font-weight:600}
.sw:disabled{opacity:.35}

@media (min-width:821px){.sheet-wrap{align-items:center}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);padding-block:16px 110px}
  .side{display:none}
  .phone-only{display:grid!important}
  .tabbar{display:flex;position:fixed;z-index:40;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
    bottom:calc(12px + env(safe-area-inset-bottom,0px));justify-content:space-around;padding:6px;border-radius:30px}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:22px;font-size:10px;font-weight:600;color:var(--fg-2);text-decoration:none;min-width:0;letter-spacing:-.01em}
  .tabbar a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbar a[aria-current="page"]{background:var(--glass-strong);color:var(--accent)}
  .toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{grid-template-columns:minmax(0,1fr)}
  .sheet-wrap{padding:8px}
}
@media (prefers-reduced-motion:reduce){*,::before,::after{transition:none!important;animation:none!important}}
@keyframes pulse{50%{opacity:.35}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.note{font-size:12.5px;color:var(--fg-3)}
.tile .hit:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hnow{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px}.hnow b{font-family:var(--font-d);font-size:38px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1}.hnow small{font-size:15px;color:var(--fg-3);font-weight:500}
.hc{position:relative}.hc svg{display:block;width:100%;height:auto;touch-action:pan-y;cursor:crosshair}
.hc .gr line{stroke:var(--hair);stroke-width:1}.hc text{fill:var(--fg-3);font-size:10px}
.hc .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}.hc .area{fill:color-mix(in srgb,var(--accent) 16%,transparent)}.hc .band{fill:color-mix(in srgb,var(--accent) 20%,transparent)}
.hc .xl{stroke:var(--fg-3);stroke-width:1;stroke-dasharray:3 3}.hc .xd{fill:var(--accent);stroke:var(--glass-strong);stroke-width:2}

function hGet(id,rg){const k=id+'|'+rg,c=HC[k];if(c&&Date.now()-c.at<3e5)return c.p;

    .then(r=>fin((r?.[id]||[]).filter(x=>x.mean!=null).map(x=>[x.start,x.mean,x.min,x.max])),()=>fin([])); // ids without long-term statistics are simply absent
  else H.callApi('GET',`history/period/${new Date(t0).toISOString()}?filter_entity_id=${id}&end_time=${encodeURIComponent(new Date(now).toISOString())}&minimal_response&no_attributes`).then(r=>{
    let p=(r?.[0]||[]).map(x=>[Math.max(t0,new Date(x.last_changed||x.last_updated).getTime()),hBin(id)?(x.state==='on'?1:x.state==='off'?0:NaN):+x.state]).filter(x=>!isNaN(x[0])&&!isNaN(x[1]));

/* ---------- shell + routing ---------- */
let view='home';
const morph=(el,html)=>Idiomorph.morph(el,html,{morphStyle:'innerHTML',ignoreActiveValue:true,
  callbacks:{beforeAttributeUpdated:(n,el)=>!(n==='open'&&el.tagName==='DETAILS'),
    beforeNodeMorphed:(el,to)=>{
      if(el._lot&&to.classList?.contains('lot')){el.dataset.lot=to.dataset.lot;return false} // keep the running animation's SVG; mountLottie swaps it only when the name changes
      return el.id!=='annText'}}}); // the browser owns <details> open state and the typed announcement
function nav(){
  const link=(id,n,i)=>`<a class="nav" href="#${id}" ${id===view?'aria-current="page"':''}>${ic(i)}<span>${n}</span></a>`;
  morph(document.getElementById('side'),`<div class="brand"><span>${ic('home')}</span>Aziz Home</div>${VIEWS.map(v=>link(...v)).join('')}<div class="foot"><span>Appearance</span>${themeSeg()}<span>${DEMO?`Demo · snapshot ${DEMO.date}`:typeof LIVE!=='undefined'&&LIVE.on?'Live · Home Assistant':'Mock data · Home Assistant preview'}</span></div>`);
  morph(document.getElementById('tabbar'),VIEWS.map(([id,n,i,sh])=>`<a href="#${id}" ${id===view?'aria-current="page"':''} aria-label="${n}">${ic(i)}<span>${sh||n}</span></a>`).join(''));
}
// morph (not replace) so nodes survive polls and CSS transitions can play; the 3D view keeps a WebGL canvas, so it is rebuilt
function segs(){document.querySelectorAll('.seg.full,.foot .seg').forEach(s=>{const b=[...s.children].filter(x=>x.tagName==='BUTTON'),i=b.findIndex(x=>x.getAttribute('aria-pressed')==='true');
  s.style.setProperty('--n',b.length);s.style.setProperty('--i',Math.max(0,i));s.classList.toggle('sl',i>=0)})}
function render(){nav();const m=document.getElementById('main'),html=vacBanner()+RENDER[view]();if(view==='3d')m.innerHTML=html;else morph(m,html);segs();mountLottie();tick();if(view==='3d')mount3d();else T3.stop?.();if(view==='music')muEnter();}
let enterT;
function route(){const h=location.hash.slice(1),m=document.getElementById('main');view=RENDER[h]?h:'home';
  m.replaceChildren();m.classList.add('enter');clearTimeout(enterT);enterT=setTimeout(()=>m.classList.remove('enter'),700); // cards rise in on a view change only
  render();window.scrollTo(0,0)}
function tick(){const c=document.getElementById('clock');if(c)c.textContent=new Date().toLocaleString(undefined,{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
  document.querySelectorAll('[data-until]').forEach(r=>{const l=minsLeft(+r.dataset.until);r.style.setProperty('--p',Math.min(100,l/.3));r.querySelector('b').textContent=l;
    r.closest('.cc')?.querySelectorAll('[data-left]').forEach(x=>x.textContent=l+' min left')})}
setInterval(tick,5000);
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m+(typeof DEMO!=='undefined'&&DEMO?' · demo, not sent to your home':'');t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2200)}
function update(){if(LIVE.on)LIVE.push();render();if(T3.ready)T3.sync();if(sheetId)drawSheet()}

}
function startVacation(){const V=S[VAC_ID],st=VD.startMode==='now'?today():VD.start,dated=VD.endMode==='date';
  Object.assign(V,{start:st,end:dated?VD.end:null,robotEvery:VD.robotEvery,robotTime:VD.robotTime,alerts:VD.alerts,preheat:VD.preheat&&dated,preheatH:VD.preheatH,sim:VD.sim,humidity:VD.humidity});
  closeSheet();
  if(st>today()){V.scheduled=true;V.on=false;update();toast(`Vacation scheduled from ${fmtD(st)}`)}else{activateVac();update()}}
function activateVac(){const V=S[VAC_ID];V.on=true;V.scheduled=false;
  ids('light.').forEach(k=>{S[k].on=false;S[k].sim=V.sim&&SIM_LIGHTS.includes(k)});S['switch.rice_cooker'].on=false;
  ids('climate.').forEach(k=>S[k].preset='Frost protection');
  if(['Cleaning','Paused'].includes(S[VAC].status))simDock();
  toast('Vacation mode on. Everything is off')}
function endVac(){const V=S[VAC_ID],was=V.on;V.on=false;V.scheduled=false;ids('light.').forEach(k=>delete S[k].sim);
  if(was)ids('climate.').forEach(k=>S[k].preset='Schedule');update();toast(was?'Welcome back. Normal mode restored':'Vacation cancelled')}

/* ---------- Roborock simulation (previews live position) ---------- */
// Room rectangles in metres, measured from Home layout.PNG (x → right, z → down, origin = living room top-left).
const R3={living:[0,0,6.29,4.2],studio:[6.29,0,9.79,4.2],balcony:[3.63,-1.41,7.08,0],bedroom:[0,4.2,3.93,8.6],
  hallway:[3.93,4.2,8.56,5.61],kitchen:[3.93,5.61,6.4,8.6],bathroom:[6.4,5.61,8.56,8.6]};
const DOCK=[6.55,3.7], HALL=[6.2,4.9];
const SIM={pts:[],meta:[],seg:0,pos:[...DOCK],heading:0,running:false,trail:[[...DOCK]],timer:null};
function lanes(r){const [x0,z0,x1,z1]=R3[r],m=.35,out=[];let flip=false;

  return `When ${w}${i.length?', if '+i.join(' and '):''} → ${dd.slice(0,3).join(', ')||'custom steps'}${dd.length>3?' …':''}`}

/* editable fields: every common, non-template value in the config, bound to its path */
function auFields(c){const F=[],add=(label,path,type,val)=>F.push({label,path,type,val});
  add('Name',['alias'],'text',c.alias||'');
  list(c.triggers).forEach((t,i)=>{const p=['triggers',i],k=t.trigger;
    if(k==='sun')add(`Minutes from ${t.event} (− = before)`,[...p,'offset'],'offset',toMin(t.offset||'0:0')||0);
    if(k==='time'&&typeof t.at==='string'&&/^\d/.test(t.at))add('Time',[...p,'at'],'time',t.at.slice(0,5));
    if(k==='time'&&t.at?.offset!=null)add(`Minutes from ${fname(t.at.entity_id)} (− = before)`,[...p,'at','offset'],'offset',toMin(t.at.offset)||0);
    if(t.for!=null&&toMin(t.for)!=null)add(`${fname(list(t.entity_id)[0])}${t.id?` (${t.id})`:''}: for (min)`,[...p,'for'],'minutes',toMin(t.for));
    for(const x of ['above','below'])if(k==='numeric_state'&&typeof t[x]==='number')add(`${names(t.entity_id)}: ${x}`,[...p,x],'num',t[x]);});
  const conds=(cs,p,pre)=>list(cs).forEach((c,i)=>{const q=[...p,i];
    if(c.condition==='time'){if(c.weekday)add(`${pre}Days`,[...q,'weekday'],'days',list(c.weekday));
      for(const x of ['after','before'])if(/^\d/.test(c[x]||''))add(`${pre}${x==='after'?'After':'Before'}`,[...q,x],'time',c[x].slice(0,5))}
    if(c.condition==='numeric_state'&&c.entity_id!=='zone.home')for(const x of ['above','below'])if(typeof c[x]==='number')add(`${pre}${names(c.entity_id)} ${x}`,[...q,x],'num',c[x]);
    if(c.for!=null&&toMin(c.for)!=null)add(`${pre}${names(c.entity_id)} for (min)`,[...q,'for'],'minutes',toMin(c.for));});
  conds(c.conditions,['conditions'],'Only if · ');
  const acts=(as,p,pre)=>list(as).forEach((a,i)=>{const q=[...p,i],d=a.data||{},tg=names(a.target?.entity_id||a.entity_id);
    if(a.action==='light.turn_on'){if(typeof d.brightness_pct==='number')add(`${pre}${tg} brightness %`,[...q,'data','brightness_pct'],'num',d.brightness_pct);
      if(typeof d.color_temp_kelvin==='number')add(`${pre}${tg} warmth K`,[...q,'data','color_temp_kelvin'],'num',d.color_temp_kelvin);
      if(typeof d.transition==='number')add(`${pre}${tg} fade (s)`,[...q,'data','transition'],'num',d.transition)}
    if(a.action==='tado_x.set_climate_timer'){if(typeof d.temperature==='number')add(`${pre}${tg} °C`,[...q,'data','temperature'],'num',d.temperature);if(typeof d.duration==='number')add(`${pre}${tg} for (min)`,[...q,'data','duration'],'num',d.duration)}
    if(a.action?.startsWith('notify.')&&typeof d.message==='string'&&!d.message.includes('{'))add(`${pre}Message`,[...q,'data','message'],'text',d.message);
    if(a.delay!=null&&toMin(a.delay)!=null)add(`${pre}Wait (min)`,[...q,'delay'],'minutes',toMin(a.delay));
    if(a.wait_for_trigger)list(a.wait_for_trigger).forEach((t,j)=>{if(t.for!=null&&toMin(t.for)!=null)add(`${pre}Wait until ${fname(list(t.entity_id)[0])} ${t.to==='off'?'clear':'changes'} for (min)`,[...q,'wait_for_trigger',j,'for'],'minutes',toMin(t.for))});
    if(a.timeout!=null&&toMin(a.timeout)!=null)add(`${pre}Give up after (min)`,[...q,'timeout'],'minutes',toMin(a.timeout));
    if(a.if){conds(a.if,[...q,'if'],'If · ');acts(a.then,[...q,'then'],'Then · ');acts(a.else,[...q,'else'],'Otherwise · ')}
    if(a.sequence)acts(a.sequence,[...q,'sequence'],pre);});
  acts(c.actions,['actions'],'Do · ');
  return F}
const setPath=(o,p,v)=>{let x=o;for(const k of p.slice(0,-1))x=x[k]??={};x[p.at(-1)]=v};
function auSet(f,raw){const v={text:()=>raw,time:()=>raw+':00',offset:()=>fromMin(+raw||0),minutes:()=>fromMin(Math.max(0,+raw||0)),num:()=>+raw,days:()=>raw}[f.type]();setPath(AU.draft,f.path,v);f.val=raw}

function vAutomations(){
  if(!LIVE.on)return head('Automations','Schedules and automations')+`<div class="card glass"><p class="note" style="margin:0">Open this dashboard inside Home Assistant to see, change and create automations.</p></div>`;
  const H=LIVE.H(),admin=H.user?.is_admin!==false;
  if(!AU.loading&&Date.now()-AU.loaded>60000)auLoad();
  const all=Object.keys(H.states).filter(k=>k.startsWith('automation.')).map(LIVE.st).sort((a,b)=>(a.attributes.friendly_name||'').localeCompare(b.attributes.friendly_name||''));
  const groups={};for(const s of all){const n=s.attributes.friendly_name||s.entity_id,id=s.attributes.id||'';
    const g=n.includes(' · ')&&!id.startsWith('dash_')?n.split(' · ')[0]:'Yours';(groups[g]??=[]).push(s)}
  const order=['Yours','Schedule','Presence','Kitchen','Studio','Living room','Washer','Remote'];
  const keys=Object.keys(groups).sort((a,b)=>((order.indexOf(a)+99)%99)-((order.indexOf(b)+99)%99)||a.localeCompare(b));
  const row=(s)=>{const n=s.attributes.friendly_name||s.entity_id,id=s.attributes.id,c=AU.cfg[id],on=s.state==='on',last=s.attributes.last_triggered;
    const sum=c?auDescribe(c):id?(AU.loading?'Loading…':'Couldn\'t load this one'):'Written in YAML, so edit it in Home Assistant';
    return `<div class="arow"><div class="atx"><b>${esc((n.includes(' · ')?n.split(' · ').slice(1).join(' · '):n).replace(/^./,c=>c.toUpperCase()))}</b><small>${esc(sum)}</small><span class="note">${last?'Last ran '+LIVE.ago(last):'Hasn\'t run yet'}</span></div>
     <div class="aact"><button class="btn small" data-au="run" data-aid="${s.entity_id}" ${admin?'':'disabled'}>Run</button>${id&&admin?`<button class="btn small" data-au="edit" data-aid="${esc(id)}">Edit</button>`:''}<button class="sw" data-au="tog" data-aid="${s.entity_id}" aria-pressed="${on}" aria-label="${esc(n)}" ${admin?'':'disabled'}></button></div></div>`};
  const on=all.filter(s=>s.state==='on').length;
  return head('Automations',`${on} of ${all.length} on`,admin?`<button class="btn primary" data-au="new">${ic('flow','sm')} New</button>`:'')+
   (admin?'':`<div class="card glass" style="margin-bottom:16px"><p class="note" style="margin:0">View only: sign in to Home Assistant as an administrator to change automations.</p></div>`)+
   keys.map(g=>`<section class="sec"><h2>${esc(g)}</h2><div class="card glass">${groups[g].map(row).join('')}</div></section>`).join('')}
function auLoad(){AU.loading=true;const ids=Object.values(LIVE.H().states).filter(s=>s.entity_id.startsWith('automation.')&&s.attributes.id).map(s=>s.attributes.id);
  Promise.all(ids.map(id=>auApi('GET',id).then(c=>{AU.cfg[id]=c},()=>{}))).then(()=>{AU.loading=false;AU.loaded=Date.now();if(view==='automations'&&!sheetId)render()})}

function drawAuto(){
  if(sheetId==='auto:new')return drawBuilder();
  const c=AU.draft,F=AU.fields,el=document.getElementById('sheet');el.style.setProperty('--glow','var(--accent)');
  const input=(f,i)=>f.type==='days'?`<div class="toggles" style="justify-content:flex-end">${DOW.map(([k,n])=>`<button class="tog" data-au="day" data-ai="${i}" data-day="${k}" aria-pressed="${f.val.includes(k)}">${n}</button>`).join('')}</div>`
    :`<input class="vin" data-af="${i}" type="${f.type==='text'?'text':f.type==='time'?'time':'number'}" ${f.type==='minutes'?'min="0"':''} value="${esc(f.val)}" aria-label="${esc(f.label)}">`;
  el.innerHTML=`<div class="hd"><div class="ico">${ic('flow')}</div><div><b id="sheetTitle">${esc(c.alias||'Automation')}</b><small>${esc(auDescribe(c))}</small></div></div>
   ${F.map((f,i)=>`<div class="afield ${f.type==='text'||f.type==='days'?'full':''}"><span>${esc(f.label)}</span>${input(f,i)}</div>`).join('')}
   <p class="note">Need another trigger, condition or step? Open it in Home Assistant's editor, which has everything.</p>
   <div class="row" style="margin-top:12px;justify-content:space-between"><button class="btn" data-au="del" style="${AU.del?'color:var(--bad)':''}">${AU.del?'Tap again to delete':'Delete'}</button>
    <div class="row"><button class="btn" data-au="ha">HA editor</button><button class="btn" data-close>Cancel</button><button class="btn primary" data-au="save">Save</button></div></div>`}

/* new-automation builder: one trigger, a few common checks, one or more steps */
const pick=(pred)=>Object.values(LIVE.H().states).filter(s=>pred(s)&&s.state!=='unavailable').map(s=>[s.entity_id,s.attributes.friendly_name||s.entity_id]).sort((a,b)=>a[1].localeCompare(b[1]));
const dcIs=(...d)=>(s)=>s.entity_id.startsWith('binary_sensor.')&&d.includes(s.attributes.device_class);
const PICK={on:()=>pick(s=>s.entity_id.startsWith('light.')),off:()=>pick(s=>s.entity_id.startsWith('light.')),scene:()=>pick(s=>s.entity_id.startsWith('scene.')),
  plugon:()=>pick(s=>s.entity_id.startsWith('switch.')&&!/do_not_disturb|_power$/.test(s.entity_id)),plugoff:()=>PICK.plugon(),
  say:()=>pick(s=>/^notify\.echo_.*_announce$/.test(s.entity_id)),push:()=>[]};
const KINDS=[['on','Light on'],['off','Light off'],['scene','Scene'],['plugon','Plug on'],['plugoff','Plug off'],['say','Echo says'],['push','iPhone push']];
const auStep=(k)=>({k,id:PICK[k]()[0]?.[0]||'',bri:80,kel:2700,msg:''});
function auNew(from){const m=pick(dcIs('motion','occupancy','presence')),d=pick(dcIs('door','window','opening'));
  AU.nb={when:'sun',event:'sunset',offset:0,time:'07:00',days:DOW.map(x=>x[0]),sensor:m[0]?.[0]||'',door:d[0]?.[0]||'',zone:'leave',offMin:5,home:true,dark:false,vac:true,acts:[auStep('on')],name:''};
  openSheet('auto:new',from)}
function auSuggest(n){const w={sun:n.event[0].toUpperCase()+n.event.slice(1),time:n.time,motion:fname(n.sensor),door:fname(n.door),zone:n.zone==='leave'?'Everyone left':'Arrival'}[n.when];
  const a=n.acts[0];return `${w} · ${a?(a.k==='push'?'iPhone push':a.k==='say'?'Echo announcement':fname(a.id)+(a.k.endsWith('off')?' off':a.k==='scene'?'':' on')):'—'}`}
function auBuild(n){const sup=(id)=>list(LIVE.H().states[id]?.attributes?.supported_color_modes);
  const T={sun:{trigger:'sun',event:n.event,offset:fromMin(+n.offset||0)},time:{trigger:'time',at:n.time+':00'},motion:{trigger:'state',entity_id:n.sensor,to:'on'},door:{trigger:'state',entity_id:n.door,to:'on'},
    zone:n.zone==='leave'?{trigger:'state',entity_id:'zone.home',to:'0',for:'00:05:00'}:{trigger:'state',entity_id:'zone.home',from:'0'}}[n.when];
  const C=[];if(n.when==='time'&&n.days.length<7)C.push({condition:'time',weekday:DOW.map(x=>x[0]).filter(k=>n.days.includes(k))});
  if(n.vac)C.push({condition:'state',entity_id:'input_boolean.vacation_mode',state:'off'});
  if(n.home)C.push({condition:'numeric_state',entity_id:'zone.home',above:0});
  if(n.dark)C.push({condition:'state',entity_id:'sun.sun',state:'below_horizon'});
  const A=n.acts.map(a=>{const tg={entity_id:a.id};
    if(a.k==='on'){const m=sup(a.id),data={};if(m.some(x=>x!=='onoff'))data.brightness_pct=+a.bri;if(m.includes('color_temp'))data.color_temp_kelvin=+a.kel;return {action:'light.turn_on',target:tg,data}}
    return {off:{action:'light.turn_off',target:tg},scene:{action:'scene.turn_on',target:tg},plugon:{action:'switch.turn_on',target:tg},plugoff:{action:'switch.turn_off',target:tg},
      say:{action:'notify.send_message',target:tg,data:{message:a.msg}},push:{action:'notify.mobile_app_azizs_iphone',data:{title:'Home',message:a.msg}}}[a.k]});
  const lit=n.acts.filter(a=>a.k==='on').map(a=>a.id);
  if(n.when==='motion'&&+n.offMin>0&&lit.length)A.push({wait_for_trigger:[{trigger:'state',entity_id:n.sensor,to:'off',for:fromMin(+n.offMin)}]},{action:'light.turn_off',target:{entity_id:lit}});
  return {alias:n.name.trim()||auSuggest(n),description:'Made in the Liquid Glass dashboard',mode:n.when==='motion'?'restart':'single',triggers:[T],conditions:C,actions:A}}
function auCheck(n){if(!n.acts.length)return 'Add at least one step';if(n.acts.some(a=>a.k!=='push'&&!a.id))return 'Pick a device for every step';
  if(n.acts.some(a=>(a.k==='say'||a.k==='push')&&!a.msg.trim()))return 'Type the message';if(n.when==='motion'&&!n.sensor||n.when==='door'&&!n.door)return 'Pick a sensor';return ''}
function drawBuilder(){const n=AU.nb,el=document.getElementById('sheet');el.style.setProperty('--glow','var(--accent)');
  const sel=(key,opts,val,lab,i='')=>`<select class="vin" data-nb="${key}" ${i!==''?`data-ai="${i}"`:''} aria-label="${lab}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
  const seg=(key,opts,val,lab)=>`<div class="seg full" role="group" aria-label="${lab}">${opts.map(([v,t])=>`<button data-au="nbset" data-key="${key}" data-val="${v}" aria-pressed="${v===val}">${t}</button>`).join('')}</div>`;
  const num=(key,val,lab,i='',min='')=>`<input class="vin" type="number" data-nb="${key}" ${i!==''?`data-ai="${i}"`:''} ${min!==''?`min="${min}"`:''} value="${esc(val)}" aria-label="${lab}">`;
  const when={sun:`${seg('event',[['sunrise','Sunrise'],['sunset','Sunset']],n.event,'Sun event')}<div class="afield"><span>Minutes before (−) or after</span>${num('offset',n.offset,'Minutes from the sun event')}</div>`,
    time:`<div class="afield"><span>Time</span><input class="vin" type="time" data-nb="time" value="${n.time}" aria-label="Time"></div><div class="toggles">${DOW.map(([k,t])=>`<button class="tog" data-au="nbday" data-day="${k}" aria-pressed="${n.days.includes(k)}">${t}</button>`).join('')}</div>`,
    motion:`${sel('sensor',pick(dcIs('motion','occupancy','presence')),n.sensor,'Sensor')}<div class="afield"><span>Lights off after no motion for (min, 0 = leave on)</span>${num('offMin',n.offMin,'Minutes without motion','',0)}</div>`,
    door:sel('door',pick(dcIs('door','window','opening')),n.door,'Door'),
    zone:seg('zone',[['leave','Everyone leaves'],['arrive','Someone gets home']],n.zone,'Presence')}[n.when];
  const step=(a,i)=>{const o=PICK[a.k]();return `<div class="astep">${sel('k',KINDS,a.k,'Step type',i)}${a.k==='push'?'<span class="note">to your iPhone</span>':sel('id',o.length?o:[['','Nothing to pick']],a.id,'Device',i)}
    <button class="btn small" data-au="nbdel" data-ai="${i}" aria-label="Remove step">×</button>
    ${a.k==='on'?`<div class="more">${num('bri',a.bri,'Brightness %',i,1)}${num('kel',a.kel,'Warmth in kelvin',i,2200)}</div><span class="note" style="grid-column:1/-1">Brightness % · warmth K (2200 warm … 4000 cool)</span>`:''}
    ${a.k==='say'||a.k==='push'?`<div class="more"><input class="vin" type="text" data-nb="msg" data-ai="${i}" value="${esc(a.msg)}" placeholder="Message" aria-label="Message"></div>`:''}</div>`};
  const err=auCheck(n);
  el.innerHTML=`<div class="hd"><div class="ico">${ic('flow')}</div><div><b id="sheetTitle">New automation</b><small>${esc(auDescribe(auBuild(n)))}</small></div></div>
   <div class="lbl">When</div>${seg('when',[['sun','Sun'],['time','Time'],['motion','Motion'],['door','Door'],['zone','Home']],n.when,'When')}<div style="margin-top:8px">${when}</div>
   <div class="lbl">Only if</div><div class="toggles">${[['home','Someone is home'],['dark',"It's dark"],['vac','Not on vacation']].map(([k,t])=>`<button class="tog" data-au="nbflag" data-key="${k}" aria-pressed="${n[k]}">${t}</button>`).join('')}</div>
   <div class="lbl">Do</div>${n.acts.map(step).join('')}<button class="btn small" data-au="nbadd" style="margin-top:10px">+ Add step</button>
   <div class="lbl">Name</div><input class="vin" type="text" data-nb="name" value="${esc(n.name)}" placeholder="${esc(auSuggest(n))}" aria-label="Name">
   <p class="note" id="auErrMsg" style="color:var(--warn)">${err}</p>
   <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="auCreate" data-au="create" ${err?'disabled':''}>Create</button></div>`}

if(LIVE.on){
  document.addEventListener('click',e=>{const b=e.target.closest('[data-au]');if(!b)return;const d=b.dataset,n=AU.nb;
    if(d.au==='tog'){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);LIVE.call('automation',on?'turn_on':'turn_off',{entity_id:d.aid});toast(on?'Automation on':'Automation off')}
    else if(d.au==='run'){LIVE.call('automation','trigger',{entity_id:d.aid,skip_condition:true});toast('Running it now')}
    else if(d.au==='edit'){const open=(c)=>{AU.draft=structuredClone(c);AU.eid=d.aid;AU.del=false;AU.fields=auFields(AU.draft);openSheet('auto:'+d.aid,b)};
      AU.cfg[d.aid]?open(AU.cfg[d.aid]):auApi('GET',d.aid).then(c=>{AU.cfg[d.aid]=c;open(c)},auErr)}
    else if(d.au==='day'){const f=AU.fields[d.ai],v=f.val.includes(d.day)?f.val.filter(x=>x!==d.day):[...f.val,d.day];
      if(!v.length)return toast('Keep at least one day');auSet(f,DOW.map(x=>x[0]).filter(k=>v.includes(k)));drawSheet()}
    else if(d.au==='save'){const id=AU.eid,c=AU.draft;auApi('POST',id,c).then(()=>{AU.cfg[id]=c;closeSheet();toast('Saved to Home Assistant');render()},auErr)}
    else if(d.au==='del'){if(!AU.del){AU.del=true;return drawSheet()}const id=AU.eid;auApi('DELETE',id).then(()=>{delete AU.cfg[id];closeSheet();toast('Automation deleted')},auErr)}
    else if(d.au==='ha'){const id=AU.eid;closeSheet();parent.history.pushState(null,'','/config/automation/edit/'+encodeURIComponent(id));parent.dispatchEvent(new CustomEvent('location-changed',{detail:{replace:false}}))}
    else if(d.au==='new')auNew(b);
    else if(d.au==='nbset'){n[d.key]=d.val;drawSheet()}
    else if(d.au==='nbflag'){n[d.key]=!n[d.key];drawSheet()}
    else if(d.au==='nbday'){if(n.days.includes(d.day)&&n.days.length===1)return toast('Keep at least one day');n.days=n.days.includes(d.day)?n.days.filter(x=>x!==d.day):[...n.days,d.day];drawSheet()}
    else if(d.au==='nbadd'){n.acts.push(auStep('on'));drawSheet()}
    else if(d.au==='nbdel'){n.acts.splice(+d.ai,1);drawSheet()}
    else if(d.au==='create'){if(auCheck(n))return;const id='dash_'+Date.now(),c=auBuild(n);
      auApi('POST',id,c).then(()=>{AU.cfg[id]={id,...c};AU.loaded=0;closeSheet();toast(`Created “${c.alias}”`);setTimeout(render,1500)},auErr)}
  });
  // typing updates the draft without redrawing (a redraw would swallow the next tap); only pickers redraw
  const onField=(e)=>{const t=e.target,hd=document.querySelector('#sheet .hd small');
    if(t.dataset.af!=null&&AU.fields[t.dataset.af]&&sheetId!=='auto:new'){const f=AU.fields[t.dataset.af];if(f.type==='time'&&!t.value)return;auSet(f,t.value);hd.textContent=auDescribe(AU.draft);return}
    if(t.dataset.nb&&AU.nb&&sheetId==='auto:new'){const k=t.dataset.nb,n=AU.nb;
      if(t.dataset.ai!=null){const a=n.acts[+t.dataset.ai];a[k]=t.value;if(k==='k')Object.assign(a,auStep(t.value),{msg:a.msg})}else n[k]=t.value;
      if(t.tagName==='SELECT'){if(e.type==='change')drawSheet();return}
      const err=auCheck(n);document.getElementById('auErrMsg').textContent=err;document.getElementById('auCreate').disabled=!!err;hd.textContent=auDescribe(auBuild(n));document.querySelector('#sheet [data-nb=name]').placeholder=auSuggest(n)}};
  document.addEventListener('input',onField);document.addEventListener('change',onField);
}
addEventListener('hashchange',route);route();
</script>
