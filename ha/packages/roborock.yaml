# Roborock room cleaning: pick rooms + suction + passes, then run script.robot_clean_selected_rooms.
input_boolean:
  robot_room_living_room: {name: Robot · Living Room, icon: mdi:sofa}
  robot_room_studio: {name: Robot · Studio, icon: mdi:desk}
  robot_room_bedroom: {name: Robot · Bedroom, icon: mdi:bed}
  robot_room_kitchen: {name: Robot · Kitchen, icon: mdi:stove}
  robot_room_hallway: {name: Robot · Hallway, icon: mdi:door}
  robot_room_bathroom: {name: Robot · Bathroom, icon: mdi:shower}

  # set by robot_dock_on_arrival, cleared when the next clean starts
  robot_recalled: {name: Robot · clean was recalled, icon: mdi:robot-vacuum-alert}

input_datetime:
  robot_last_full_clean:
    name: Robot · last full clean
    has_date: true
    has_time: true
    icon: mdi:robot-vacuum

input_select:
  robot_suction:
    name: Robot · suction
    # Matches the vacuum's fan_speed_list attribute exactly.
    options: [gentle, quiet, balanced, turbo, max, max_plus]
    icon: mdi:fan

input_number:
  robot_passes:
    name: Robot · passes
    min: 1
    max: 3
    step: 1
    mode: slider
    icon: mdi:repeat

script:
  robot_clean_selected_rooms:
    alias: Robot · clean selected rooms
    icon: mdi:robot-vacuum
    variables:
      # Room numbers from roborock.get_maps (read 2026-11-22); "Study" is the Studio.
      segment_ids:
        studio: 16
        bathroom: 17
        hallway: 18
        living_room: 19
        kitchen: 20
        bedroom: 22
      segments: >-
        {% set ns = namespace(s=[]) %}
        {% for room, seg in segment_ids.items() if is_state('input_boolean.robot_room_' ~ room, 'on') %}
          {% set ns.s = ns.s + [seg] %}
        {% endfor %}
        {{ ns.s }}
    sequence:
      - condition: template
        value_template: "{{ segments | count > 0 }}"
      - action: vacuum.set_fan_speed
        target:
          entity_id: vacuum.roborock_q5_pro
        data:
          fan_speed: "{{ states('input_select.robot_suction') }}"
      - action: vacuum.send_command
        target:
          entity_id: vacuum.roborock_q5_pro
        data:
          command: app_segment_clean
          params:
            - segments: "{{ segments }}"
              repeat: "{{ states('input_number.robot_passes') | int }}"

# A completed whole-flat clean ends with cleaning_progress 95-99 % after 42+ min (history 2026-11-23..26);
# aborted starts end at 0 % within a minute. Sensors still hold the finished run's values when
# the vacuum leaves "cleaning" (checked on all genuine runs), so progress >= 90 is read at that moment.
automation:
  - id: robot_mark_full_clean
    alias: Robot · mark full clean
    description: Stamps input_datetime.robot_last_full_clean when a clean ends with
      progress of at least 90 % after at least 20 minutes and was not recalled by
      someone coming home. Clears the recalled flag when a clean starts.
    mode: queued
    triggers:
      - trigger: state
        entity_id: vacuum.roborock_q5_pro
        to: cleaning
        id: started
      - trigger: state
        entity_id: vacuum.roborock_q5_pro
        from: cleaning
        to: [returning, docked]
        id: ended
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: started
            sequence:
              - action: input_boolean.turn_off
                target: {entity_id: input_boolean.robot_recalled}
          - conditions:
              - condition: trigger
                id: ended
              - condition: state
                entity_id: input_boolean.robot_recalled
                state: "off"
              - condition: template
                value_template: >-
                  {{ states('sensor.studio_roborock_cleaning_progress') | float(0) >= 90
                     and (now() - trigger.from_state.last_changed).total_seconds() >= 1200 }}
            sequence:
              - action: input_datetime.set_datetime
                target: {entity_id: input_datetime.robot_last_full_clean}
                data: {timestamp: "{{ now().timestamp() }}"}
