# Everyday automations. Every comfort automation is skipped while vacation mode is on.
# "Someone home" = zone.home (people home: Aziz + Wifey).
input_datetime:
  wake_time:
    name: Wake-up light time
    has_date: false
    has_time: true   # no `initial:`, so the time you set survives restarts

input_boolean:
  wake_up_enabled:
    name: Wake-up light (weekdays)
    icon: mdi:weather-sunset-up
