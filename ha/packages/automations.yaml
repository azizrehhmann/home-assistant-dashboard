# Everyday automations. Every comfort automation is skipped while vacation mode is on.
# "Someone home" = zone.home (people home: Aziz + Wifey).
input_datetime:
  wake_time:
    name: Wake-up light time
    has_date: false
    has_time: true   # no `initial:`, so the time you set survives restarts

input_boolean:
  wake_up_enabled:
    name: Wake-up light (weekdays)
    icon: mdi:weather-sunset-up

automation:
  # ── Schedules ────────────────────────────────────────────────
  - id: sunset_lamps
    alias: Schedule · lamps on at sunset
    triggers:
      - trigger: sun
        event: sunset
        offset: "-00:15:00"
    conditions:
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: "off"
      - condition: numeric_state
        entity_id: zone.home
        above: 0
    actions:
      - action: light.turn_on
        target: {entity_id: light.living_room_lamp}
      - action: light.turn_on
        target: {entity_id: light.studio_lamp}
        data: {brightness_pct: 60, color_temp_kelvin: 2700}

  - id: wake_up_light
    alias: Schedule · weekday wake-up light
    triggers:
      - trigger: time
        at:
          entity_id: input_datetime.wake_time
          offset: "-00:20:00"
    conditions:
      - condition: time
        weekday: [mon, tue, wed, thu, fri]
      - condition: state
        entity_id: input_boolean.wake_up_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: "off"
    actions:
      - action: light.turn_on
        target: {entity_id: light.bedside_lamp}
        data: {brightness_pct: 1, color_temp_kelvin: 2200}
      - delay: 2
      - action: light.turn_on
        target: {entity_id: light.bedside_lamp}
        data: {brightness_pct: 80, color_temp_kelvin: 3500, transition: 1200}
      - delay: "00:20:00"
      - action: tado_x.set_climate_timer
        data: {entity_id: climate.bathroom, temperature: 22, duration: 60}

  - id: balcony_lights_on
    alias: Schedule · balcony lights on at sunset
    triggers:
      - trigger: sun
        event: sunset
    conditions:
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: "off"
    actions:
      - action: light.turn_on
        target: {entity_id: light.balcony_lights}

  - id: balcony_lights_off
    alias: Schedule · balcony lights off at 23:00
    triggers:
      - trigger: time
        at: "23:00:00"
    actions:
      - action: light.turn_off
        target: {entity_id: light.balcony_lights}

  # ── Motion & presence lights ─────────────────────────────────
  - id: kitchen_motion_light
    alias: Kitchen · motion light
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.kitchen_motion
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: "off"
    actions:
      - if:
          - condition: time
            after: "22:00:00"
            before: "06:00:00"
        then:
          - action: light.turn_on
            target: {entity_id: light.kitchen_ceiling}
            data: {brightness_pct: 15, color_temp_kelvin: 2200}
        else:
          - action: light.turn_on
            target: {entity_id: light.kitchen_ceiling}
            data: {brightness_pct: 100, color_temp_kelvin: 4000}
      - wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.kitchen_motion
            to: "off"
            for: "00:03:00"
      - action: light.turn_off
        target: {entity_id: light.kitchen_ceiling}

  - id: studio_presence_on
    alias: Studio · lamp on when someone is there and it's dark
    triggers:
      - trigger: state
        entity_id: binary_sensor.studio_presence
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: "off"
      - condition: state
        entity_id: light.studio_lamp
        state: "off"
      - condition: numeric_state
        entity_id: sensor.studio_illuminance
        below: 150
    actions:
      - action: light.turn_on
        target: {entity_id: light.studio_lamp}
        data:
          brightness_pct: 80
          color_temp_kelvin: >
            {% set h = now().hour %}{{ 4000 if 6 <= h < 17 else 3000 if h < 21 else 2200 }}

  - id: studio_presence_off
    alias: Studio · lights off when empty for 5 min
    triggers:
      - trigger: state
        entity_id: binary_sensor.studio_presence
        to: "off"
        for: "00:05:00"
    conditions:
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: "off"
    actions:
      - action: light.turn_off
        target: {entity_id: light.studio_lights}
        data: {transition: 5}

  # ── Washer ───────────────────────────────────────────────────
  - id: washer_done_announce
    alias: Washer · announce when finished
    triggers:
      - trigger: state
        entity_id: sensor.washer_operation_state
        to: finished
    actions:
      - action: notify.mobile_app_azizs_iphone
        data: {title: Washer, message: "The washing machine is done."}
      - if:
          - condition: time
            after: "08:00:00"
            before: "22:00:00"
          - condition: numeric_state
            entity_id: zone.home
            above: 0
        then:
          - action: notify.send_message
            target:
              entity_id: >
                {% if is_state('binary_sensor.studio_presence','on') %}notify.echo_studio_announce
                {% elif is_state('binary_sensor.kitchen_motion','on') or is_state('binary_sensor.echo_kitchen_presence','on') %}notify.echo_kitchen_announce
                {% else %}notify.echo_living_room_announce{% endif %}
            data: {message: "The washing machine is done."}

  # ── Leaving / arriving ───────────────────────────────────────
  - id: leave_home
    alias: Presence · everyone left
    triggers:
      - trigger: state
        entity_id: zone.home
        to: "0"
        for: "00:05:00"
    actions:
      - action: light.turn_off
        target: {entity_id: all}
      - action: switch.turn_off
        target: {entity_id: switch.rice_cooker}
      - if:
          - condition: or
            conditions:
              - condition: state
                entity_id: binary_sensor.main_door
                state: "on"
              - condition: state
                entity_id: binary_sensor.balcony_door
                state: "on"
        then:
          - action: notify.mobile_app_azizs_iphone
            data:
              title: Nobody's home
              message: >
                Lights are off, but {{ 'the main door' if is_state('binary_sensor.main_door','on') else 'the balcony door' }} is open.

  - id: arrive_home
    alias: Presence · welcome light after dark
    triggers:
      - trigger: state
        entity_id: zone.home
        from: "0"
    conditions:
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: "off"
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: state
        entity_id: light.living_room_lights
        state: "off"
    actions:
      - action: light.turn_on
        target: {entity_id: light.living_room_lights}
        data: {brightness_pct: 70, color_temp_kelvin: 2700}

  # ── Safety nets ──────────────────────────────────────────────
  - id: rice_cooker_timeout
    alias: Kitchen · rice cooker off after 90 min
    triggers:
      - trigger: state
        entity_id: switch.rice_cooker
        to: "on"
        for: "01:30:00"
    actions:
      - action: switch.turn_off
        target: {entity_id: switch.rice_cooker}
      - action: notify.mobile_app_azizs_iphone
        data: {title: Rice cooker, message: "Switched off after 90 minutes."}

  - id: balcony_door_heating
    alias: Living room · heating paused while the balcony door is open
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.balcony_door
        to: "on"
        for: "00:02:00"
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: climate.living_room
            state: "off"
    actions:
      - action: climate.set_hvac_mode
        target: {entity_id: climate.living_room}
        data: {hvac_mode: "off"}
      # only undo what this automation did: wait for this door, then back to the tado schedule
      - wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.balcony_door
            to: "off"
      - action: climate.set_hvac_mode
        target: {entity_id: climate.living_room}
        data: {hvac_mode: auto}
