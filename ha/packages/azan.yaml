# Azan at prayer times on the living-room Echo (local MP3 via Echo SSML).
# Times come from the core Islamic Prayer Times integration (MWL, Hanafi, Hanau home location).
input_boolean:
  azan_enabled:
    name: Azan
    icon: mdi:mosque

automation:
  - id: azan_prayer_times
    alias: Prayer · azan on the living-room Echo
    description: >-
      Plays the azan (local file hosted on HA, played via Echo SSML, no streaming service) on the
      living-room Echo at Dhuhr, Asr, Maghrib and Isha (no Fajr). Only when the Azan switch is on,
      vacation mode is off and someone is home. Isha is skipped after 22:30.
    mode: single
    max_exceeded: silent
    triggers:
      - {trigger: time, at: sensor.islamic_prayer_times_dhuhr_prayer, id: dhuhr}
      - {trigger: time, at: sensor.islamic_prayer_times_asr_prayer, id: asr}
      - {trigger: time, at: sensor.islamic_prayer_times_maghrib_prayer, id: maghrib}
      - {trigger: time, at: sensor.islamic_prayer_times_isha_prayer, id: isha}
    conditions:
      - {condition: state, entity_id: input_boolean.azan_enabled, state: "on"}
      - {condition: state, entity_id: input_boolean.vacation_mode, state: "off"}
      - {condition: numeric_state, entity_id: zone.home, above: 0}
      - condition: template
        value_template: "{{ not (trigger.id == 'isha' and now().strftime('%H:%M') > '22:30') }}"
    actions:
      - variables:
          azan_url: !secret azan_url
      - action: notify.send_message
        target: {entity_id: notify.echo_living_room_speak}
        data:
          message: '<speak><audio src="{{ azan_url }}"/></speak>'
