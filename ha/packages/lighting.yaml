# Time-of-day lighting: one table, used by every light.
#   morning  05:00 → 1 h after sunrise        70 %  3000 K
#   day      1 h after sunrise → 1 h before sunset   80 %  3500 K
#   evening  1 h before sunset → 22:00        55 %  2700 K
#   night    22:00 → 05:00                    25 %  2202 K (warmest the IKEA bulbs go)
# Scenes, the wake-up light and the bedroom night button keep their own values.
template:
  - triggers:
      - trigger: time_pattern
        minutes: /1
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    variables:
      # sun up: next_rising is tomorrow, so "within 1 h after today's sunrise" = more than 23 h until the next one
      mode: >-
        {% set h = now().hour %}
        {% set up = is_state('sun.sun', 'above_horizon') %}
        {% set r = as_datetime(state_attr('sun.sun', 'next_rising')) %}
        {% set s = as_datetime(state_attr('sun.sun', 'next_setting')) %}
        {% if h >= 22 or h < 5 %}night
        {% elif up and r - now() > timedelta(hours=23) %}morning
        {% elif up and s - now() > timedelta(hours=1) %}day
        {% elif up %}evening
        {% elif h < 12 %}morning
        {% else %}evening{% endif %}
    sensor:
      - name: Light mode
        unique_id: light_mode
        icon: mdi:theme-light-dark
        state: "{{ mode }}"
        attributes:
          brightness_pct: "{{ {'morning': 70, 'day': 80, 'evening': 55, 'night': 25}[mode] }}"
          kelvin: "{{ {'morning': 3000, 'day': 3500, 'evening': 2700, 'night': 2202}[mode] }}"

automation:
  - id: lights_time_of_day_on_turn_on
    alias: Lights · match the time of day when turned on
    description: >-
      When a bulb is switched on by a person or device (dashboard, app, Alexa, IKEA, wall switch),
      set it to the current sensor.light_mode values. Skips automation-made turn-ons and scenes.
    mode: parallel
    max: 30
    triggers:
      - trigger: state
        entity_id: &bulbs
          - light.kitchen_light_1
          - light.kitchen_light_2
          - light.kitchen_light_3
          - light.studio_lamp_1
          - light.studio_lamp_2
          - light.studio_lamp_3
          - light.studio_light
          - light.bedside_lamp
          - light.bedside_lamp_2
          - light.bedroom_ceiling
          - light.hallway_light
          - light.living_room_light_1
          - light.living_room_light_2
        from: ['off', 'unavailable']
        to: 'on'
    conditions:
      - "{{ trigger.to_state.context.parent_id is none }}"
      - alias: No scene activated in the last 5 s
        condition: template
        value_template: >-
          {% set t = states.scene | map(attribute='state') | reject('in', ['unknown', 'unavailable']) | map('as_datetime') | list %}
          {{ t | count == 0 or now() - (t | max) > timedelta(seconds=5) }}
      - "{{ state_attr('sensor.light_mode', 'kelvin') is not none }}"
    actions:
      - action: light.turn_on
        target:
          entity_id: "{{ trigger.entity_id }}"
        data:
          brightness_pct: "{{ state_attr('sensor.light_mode', 'brightness_pct') }}"
          color_temp_kelvin: "{{ state_attr('sensor.light_mode', 'kelvin') }}"
          transition: 1

  - id: lights_time_of_day_drift
    alias: Lights · shift warmth when the time of day changes
    description: Lights already on in white mode take the new colour temperature. Brightness and coloured lights are left alone.
    triggers:
      - trigger: state
        entity_id: sensor.light_mode
        not_from: ['unknown', 'unavailable']
        not_to: ['unknown', 'unavailable']
    variables:
      bulbs: *bulbs
      targets: >-
        {{ expand(bulbs) | selectattr('state', 'eq', 'on')
           | selectattr('attributes.color_mode', 'eq', 'color_temp')
           | map(attribute='entity_id') | list }}
    conditions:
      - "{{ targets | count > 0 }}"
    actions:
      - action: light.turn_on
        target:
          entity_id: "{{ targets }}"
        data:
          color_temp_kelvin: "{{ state_attr('sensor.light_mode', 'kelvin') }}"
          transition: 60

  - id: bedside_lamps_mirror
    alias: Lights · bedside lamps share brightness and colour
    description: >-
      When you (or a device) change one bedside lamp, the other takes the same brightness and colour if it is on.
      On/off stays independent. Ignores automation-made changes, which is what prevents loops.
    mode: restart
    triggers:
      - trigger: state
        entity_id: [light.bedside_lamp, light.bedside_lamp_2]  # no from/to: a from/to filter would hide brightness and colour changes
    conditions:
      - "{{ trigger.to_state.state == 'on' and trigger.from_state is not none and trigger.from_state.state in ['on', 'off'] }}"
      - "{{ trigger.to_state.context.parent_id is none }}"
    actions:
      # let a quick dim finish and the time-of-day turn-on settle before copying
      - delay: 1.5
      - variables:
          other: "{{ 'light.bedside_lamp_2' if trigger.entity_id == 'light.bedside_lamp' else 'light.bedside_lamp' }}"
          # a lamp that was just switched on takes the other lamp's setting; otherwise the changed lamp is the source
          turned_on: "{{ trigger.from_state.state == 'off' }}"
          src: "{{ other if turned_on else trigger.entity_id }}"
          dst: "{{ trigger.entity_id if turned_on else other }}"
          a: "{{ states[src].attributes if is_state(src, 'on') else none }}"
          b: "{{ states[dst].attributes if is_state(dst, 'on') else none }}"
      - condition: template
        value_template: >-
          {{ a is not none and b is not none and a.brightness is not none and
             (((a.brightness | int) - (b.brightness | default(0) | int)) | abs > 3 or
              ((a.color_temp_kelvin | default(0) | int) - (b.color_temp_kelvin | default(0) | int)) | abs > 50 or
              a.color_mode != b.color_mode) }}
      - choose:
          - conditions: "{{ a.color_mode == 'xy' }}"
            sequence:
              - action: light.turn_on
                target: {entity_id: "{{ dst }}"}
                data:
                  xy_color: "{{ a.xy_color }}"
                  brightness: "{{ a.brightness }}"
        default:
          - action: light.turn_on
            target: {entity_id: "{{ dst }}"}
            data:
              color_temp_kelvin: "{{ a.color_temp_kelvin }}"
              brightness: "{{ a.brightness }}"
