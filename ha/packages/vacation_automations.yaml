# Vacation mode automations. Helpers live in vacation.yaml.
# Phone notifications go to both phones: notify.mobile_app_azizs_iphone and notify.mobile_app_iphone_wifey.
automation:
  - id: vacation_start_scheduled
    alias: Vacation · start at the scheduled time
    triggers:
      - trigger: time
        at: input_datetime.vacation_start
    conditions:
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: "off"
    actions:
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.vacation_mode}

  - id: vacation_on
    alias: Vacation · lock the flat down
    triggers:
      - trigger: state
        entity_id: input_boolean.vacation_mode
        to: "on"
    actions:
      # stamp the real start, also when switched on by hand (robot schedule and banner use it)
      - action: input_datetime.set_datetime
        target: {entity_id: input_datetime.vacation_start}
        data: {timestamp: "{{ now().timestamp() }}"}
      - action: light.turn_off
        target: {entity_id: all}
      - action: switch.turn_off
        target: {entity_id: switch.rice_cooker}
      # tado "off" = frost protection
      - action: climate.set_hvac_mode
        target: {entity_id: [climate.living_room, climate.studio, climate.bedroom, climate.bathroom]}
        data: {hvac_mode: "off"}
      - action: notify.mobile_app_azizs_iphone
        data:
          title: Vacation mode on
          message: >-
            Everything is off and heating is on frost protection.
            {% if is_state('input_boolean.vacation_open_ended','on') %}Open-ended.{% else %}Ends {{ as_timestamp(states('input_datetime.vacation_end')) | timestamp_custom('%a %d %b, %H:%M') }}.{% endif %}
      - action: notify.mobile_app_iphone_wifey
        data:
          title: Vacation mode on
          message: >-
            Everything is off and heating is on frost protection.
            {% if is_state('input_boolean.vacation_open_ended','on') %}Open-ended.{% else %}Ends {{ as_timestamp(states('input_datetime.vacation_end')) | timestamp_custom('%a %d %b, %H:%M') }}.{% endif %}

  - id: vacation_keep_off
    alias: Vacation · keep lights and plugs off
    triggers:
      - trigger: state
        entity_id:
          - light.bedroom_ceiling
          - light.bedside_lamp
          - light.bedside_lamp_2
          - light.living_room_light_1
          - light.living_room_light_2
          - light.living_room_lamp
          - light.tv_lights
          - light.kitchen_ceiling
          - light.studio_lamp
          - light.studio_light
          - light.balcony_lights
          - switch.rice_cooker
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: "on"
      # the presence simulation routine may use these lights in the evening (members of the groups included)
      - condition: template
        value_template: >-
          {{ not (is_state('input_boolean.vacation_presence_simulation','on')
                  and trigger.entity_id in ['light.living_room_lamp','light.living_room_ceiling',
                                            'light.living_room_light_1','light.living_room_light_2',
                                            'light.kitchen_ceiling','light.bedside_lamps',
                                            'light.bedside_lamp','light.bedside_lamp_2']
                  and now().hour >= 16) }}
    actions:
      - action: homeassistant.turn_off
        target: {entity_id: "{{ trigger.entity_id }}"}

  - id: vacation_robot_schedule
    alias: Vacation · robot cleans every N days
    triggers:
      - trigger: time
        at: input_datetime.vacation_robot_time
    conditions:
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: "on"
      - condition: template
        value_template: >-
          {% set d = (now().date() - as_datetime(states('input_datetime.vacation_start')).date()).days %}
          {{ d > 0 and d % (states('input_number.vacation_robot_every_days') | int(3)) == 0 }}
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states.input_boolean | selectattr('entity_id','search','robot_room_') | selectattr('state','eq','on') | list | count > 0 }}"
            sequence:
              - action: script.robot_clean_selected_rooms
        default:
          - action: vacuum.start
            target: {entity_id: vacuum.roborock_q5_pro}

  - id: vacation_security_alert
    alias: Vacation · security alert
    mode: queued
    triggers:
      - trigger: state
        entity_id: [binary_sensor.main_door, binary_sensor.balcony_door, binary_sensor.hallway_motion, binary_sensor.kitchen_motion]
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: "on"
      - condition: state
        entity_id: input_boolean.vacation_security_alerts
        state: "on"
      # the robot sets off motion sensors while cleaning
      - condition: not
        conditions:
          - condition: state
            entity_id: vacuum.roborock_q5_pro
            state: [cleaning, returning]
    actions:
      - action: notify.mobile_app_azizs_iphone
        data:
          title: "⚠️ {{ trigger.to_state.name }}"
          message: "Triggered at {{ now().strftime('%H:%M') }} while you're on vacation."
          data:
            push:
              interruption-level: time-sensitive
      - action: notify.mobile_app_iphone_wifey
        data:
          title: "⚠️ {{ trigger.to_state.name }}"
          message: "Triggered at {{ now().strftime('%H:%M') }} while you're on vacation."
          data:
            push:
              interruption-level: time-sensitive

  - id: vacation_presence_simulation
    alias: Vacation · presence simulation
    description: Evening routine that looks lived in. Dusk, living-room lamp and ceiling;
      19:30, kitchen ceiling for 15-30 minutes; 22:30, living room off and bedside
      lamps on. Every step starts 0-20 minutes late.
    mode: parallel
    triggers:
      - trigger: sun
        event: sunset
        id: dusk
      - trigger: time
        at: "19:30:00"
        id: kitchen
      - trigger: time
        at: "22:30:00"
        id: bed
    conditions:
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: "on"
      - condition: state
        entity_id: input_boolean.vacation_presence_simulation
        state: "on"
    actions:
      - delay:
          minutes: "{{ range(0, 21) | random }}"
      - choose:
          - conditions:
              - condition: trigger
                id: dusk
            sequence:
              - action: light.turn_on
                target: {entity_id: light.living_room_lamp}
              - action: light.turn_on
                target: {entity_id: light.living_room_ceiling}
                data: {brightness_pct: 60, color_temp_kelvin: 2700}
          - conditions:
              - condition: trigger
                id: kitchen
            sequence:
              - action: light.turn_on
                target: {entity_id: light.kitchen_ceiling}
                data: {brightness_pct: 70, color_temp_kelvin: 2700}
              - delay:
                  minutes: "{{ range(15, 31) | random }}"
              - action: light.turn_off
                target: {entity_id: light.kitchen_ceiling}
          - conditions:
              - condition: trigger
                id: bed
            sequence:
              - action: light.turn_off
                target: {entity_id: [light.living_room_lamp, light.living_room_ceiling]}
              - action: light.turn_on
                target: {entity_id: light.bedside_lamps}
                data: {brightness_pct: 40, color_temp_kelvin: 2200}

  - id: vacation_presence_simulation_end
    alias: Vacation · simulation lights off for the night
    triggers:
      - trigger: time
        at: "23:15:00"
    conditions:
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: "on"
    actions:
      - delay:
          minutes: "{{ range(0, 21) | random }}"
      - action: light.turn_off
        target: {entity_id: [light.living_room_lamp, light.living_room_ceiling, light.kitchen_ceiling, light.bedside_lamps]}

  - id: vacation_humidity_alert
    alias: Vacation · humidity alert
    triggers:
      # tado cloud humidity sensors; rename if yours differ
      - trigger: numeric_state
        entity_id: [sensor.living_room_humidity, sensor.studio_humidity, sensor.bedroom_humidity, sensor.bathroom_humidity]
        above: 65
        for: {hours: 2}
    conditions:
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: "on"
      - condition: state
        entity_id: input_boolean.vacation_humidity_alerts
        state: "on"
    actions:
      - action: notify.mobile_app_azizs_iphone
        data:
          title: "💧 High humidity: {{ trigger.to_state.name }}"
          message: "{{ trigger.to_state.state }}% for 2 hours. Risk of mould; ask a neighbour to air the flat."
      - action: notify.mobile_app_iphone_wifey
        data:
          title: "💧 High humidity: {{ trigger.to_state.name }}"
          message: "{{ trigger.to_state.state }}% for 2 hours. Risk of mould; ask a neighbour to air the flat."

  - id: vacation_preheat
    alias: Vacation · pre-heat before return
    triggers:
      - trigger: template
        value_template: >-
          {{ is_state('input_boolean.vacation_mode','on')
             and is_state('input_boolean.vacation_open_ended','off')
             and now().timestamp() >= state_attr('input_datetime.vacation_end','timestamp') | float(0)
                                      - states('input_number.vacation_preheat_hours') | int(3) * 3600 }}
    conditions:
      - condition: state
        entity_id: input_boolean.vacation_preheat
        state: "on"
    actions:
      # cloud tado "auto" = back to your tado schedule (HomeKit "heat" would be a manual override)
      - action: climate.set_hvac_mode
        target: {entity_id: [climate.living_room, climate.studio, climate.bedroom, climate.bathroom]}
        data: {hvac_mode: auto}
      - action: notify.mobile_app_azizs_iphone
        data:
          message: "🔥 Heating back on for your return."
      - action: notify.mobile_app_iphone_wifey
        data:
          message: "🔥 Heating back on for your return."

  - id: vacation_end_scheduled
    alias: Vacation · end at the return time
    triggers:
      - trigger: time
        at: input_datetime.vacation_end
    conditions:
      - condition: state
        entity_id: input_boolean.vacation_open_ended
        state: "off"
    actions:
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.vacation_mode}

  - id: vacation_off
    alias: Vacation · welcome home
    triggers:
      - trigger: state
        entity_id: input_boolean.vacation_mode
        from: "on"
        to: "off"
    actions:
      # cloud tado "auto" = back to your tado schedule (HomeKit "heat" would be a manual override)
      - action: climate.set_hvac_mode
        target: {entity_id: [climate.living_room, climate.studio, climate.bedroom, climate.bathroom]}
        data: {hvac_mode: auto}
      - action: notify.mobile_app_azizs_iphone
        data:
          title: Welcome back
          message: Vacation mode is off and your automations are running again.
      - action: notify.mobile_app_iphone_wifey
        data:
          title: Welcome back
          message: Vacation mode is off and your automations are running again.
