# IKEA BILRESA remotes (Matter event entities).
# Scroll wheel: 3 channels x 3 buttons. Per channel: button A/B = turn steps (multi_press_N = N clicks),
# button C = press (multi_press_1 single, multi_press_2 double).
# Channel 1 = whole room, 2 = ceiling, 3 = lamp. Double-press = the room's scene.
script:
  remote_light:
    alias: Remote · light action
    mode: parallel
    max: 30
    fields:
      target: {description: light entity}
      kind: {description: "up | down | press"}
      ev: {description: event_type from the remote}
      scene: {description: scene for double-press}
    sequence:
      - choose:
          - conditions: "{{ kind == 'press' and ev == 'multi_press_1' }}"
            sequence:
              - action: light.toggle
                target: {entity_id: "{{ target }}"}
          - conditions: "{{ kind == 'press' and ev == 'multi_press_2' }}"
            sequence:
              - action: scene.turn_on
                target: {entity_id: "{{ scene }}"}
          # turning: skip on/off-only lights (the living room lamp is a plug)
          - conditions: "{{ kind in ['up','down'] and ev.startswith('multi_press_') and state_attr(target,'supported_color_modes') != ['onoff'] }}"
            sequence:
              - action: light.turn_on
                target: {entity_id: "{{ target }}"}
                data:
                  brightness_step_pct: "{{ (ev.split('_')[-1] | int) * 5 * (1 if kind == 'up' else -1) }}"
