    to: 'on'
    for: 01:00:00
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.rice_cooker
  - action: notify.mobile_app_azizs_iphone
    data:
      title: Rice cooker
      message: Switched off after 60 minutes.
  - action: notify.mobile_app_iphone_wifey
    data:
      title: Rice cooker
      message: Switched off after 60 minutes.
- id: balcony_door_heating
  alias: Living room · heating paused while the balcony door is open
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.balcony_door
    to: 'on'
    for: 00:02:00
  conditions:
