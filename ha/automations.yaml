- id: remote_bedroom_dual_button
  alias: Remote · Bedroom dual button
  mode: queued
  triggers:
  - trigger: state
    entity_id:
    - event.bedroom_dual_button_1
    - event.bedroom_dual_button_2
    not_from:
    - unavailable
    not_to:
    - unavailable
    - unknown
  variables:
    ev: '{{ trigger.to_state.attributes.event_type }}'
  actions:
  - choose:
    - conditions: '{{ trigger.entity_id.endswith(''_1'') and ev == ''multi_press_1''
        }}'
      sequence:
      - action: light.toggle
        target:
          entity_id: light.bedside_lamps
    - conditions: '{{ trigger.entity_id.endswith(''_1'') and ev == ''long_press''
        }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bedside_lamps
        data:
          brightness_pct: 10
          color_temp_kelvin: 2200
    - conditions: '{{ trigger.entity_id.endswith(''_2'') and ev == ''multi_press_1''
        }}'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.night
