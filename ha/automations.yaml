- id: sunset_lamps
  alias: Schedule · lamps on at sunset
  triggers:
  - trigger: sun
    event: sunset
    offset: -00:15:00
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  - condition: numeric_state
    entity_id: zone.home
    above: 0
  actions:
  - action: light.turn_on
    target:
      entity_id: light.living_room_lamp
  - action: light.turn_on
    target:
      entity_id: light.studio_lamp
    data:
      brightness_pct: '{{ state_attr(''sensor.light_mode'', ''brightness_pct'') }}'
      color_temp_kelvin: '{{ state_attr(''sensor.light_mode'', ''kelvin'') }}'
- id: wake_up_light
  alias: Schedule · weekday wake-up light
  triggers:
  - trigger: time
    at:
      entity_id: input_datetime.wake_time
      offset: -00:20:00
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: state
    entity_id: input_boolean.wake_up_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.bedside_lamp
    data:
      brightness_pct: 1
      color_temp_kelvin: 2200
  - delay: 2
  - action: light.turn_on
    target:
      entity_id: light.bedside_lamp
    data:
      brightness_pct: 80
      color_temp_kelvin: 3500
      transition: 1200
  - delay: 00:20:00
  - action: tado_x.set_climate_timer
    data:
      entity_id: climate.bathroom
      temperature: 22
      duration: 60
- id: balcony_lights_on
  alias: Schedule · balcony lights on at sunset
  triggers:
  - trigger: sun
    event: sunset
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.balcony_lights
- id: balcony_lights_off
  alias: Schedule · balcony lights off at 23:00
  triggers:
  - trigger: time
    at: '23:00:00'
  actions:
  - action: light.turn_off
    target:
      entity_id: light.balcony_lights
- id: kitchen_motion_light
  alias: Kitchen · motion light
  description: Turns the light on only if it is off and the room is dark. Brightness and colour come from sensor.light_mode (packages/lighting.yaml). Never overrides a light you set yourself; off after 3 min without motion.
  mode: restart
  triggers:
  - trigger: state
    entity_id: binary_sensor.kitchen_motion
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: light.kitchen_ceiling
      state: unavailable
  actions:
  - if:
    - condition: state
      entity_id: light.kitchen_ceiling
      state: 'off'
    - condition: numeric_state
      entity_id: sensor.kitchen_illuminance
      below: 30
    then:
    - action: light.turn_on
      target:
        entity_id: light.kitchen_ceiling
      data:
        brightness_pct: '{{ state_attr(''sensor.light_mode'', ''brightness_pct'') }}'
        color_temp_kelvin: '{{ state_attr(''sensor.light_mode'', ''kelvin'') }}'
        transition: 1
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.kitchen_motion
      to: 'off'
      for: 00:03:00
  - condition: state
    entity_id: light.kitchen_ceiling
    state: 'on'
  - action: light.turn_off
    target:
      entity_id: light.kitchen_ceiling
    data:
      transition: 2
- id: studio_presence_on
  alias: Studio · lamp on when someone is there and it's dark
  triggers:
  - trigger: state
    entity_id: binary_sensor.studio_presence
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  - condition: state
    entity_id: light.studio_lamp
    state: 'off'
  - condition: numeric_state
    entity_id: sensor.studio_illuminance
    below: 150
  actions:
  - action: light.turn_on
    target:
      entity_id: light.studio_lamp
    data:
      brightness_pct: '{{ state_attr(''sensor.light_mode'', ''brightness_pct'') }}'
      color_temp_kelvin: '{{ state_attr(''sensor.light_mode'', ''kelvin'') }}'
- id: studio_presence_off
  alias: Studio · lights off when empty for 5 min
  triggers:
  - trigger: state
    entity_id: binary_sensor.studio_presence
    to: 'off'
    for: 00:05:00
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  actions:
  - action: light.turn_off
    target:
      entity_id: light.studio_lights
    data:
      transition: 5
- id: washer_done_announce
  alias: Washer · announce when finished
  triggers:
  - trigger: state
    entity_id: sensor.washer_operation_state
    to: finished
  actions:
  - action: notify.mobile_app_azizs_iphone
    data:
      title: Washer
      message: The washing machine is done.
  - if:
    - condition: time
      after: 08:00:00
      before: '22:00:00'
    - condition: numeric_state
      entity_id: zone.home
      above: 0
    then:
    - action: notify.send_message
      target:
        entity_id: '{% if is_state(''binary_sensor.studio_presence'',''on'') %}notify.echo_studio_announce
          {% elif is_state(''binary_sensor.kitchen_motion'',''on'') or is_state(''binary_sensor.echo_kitchen_presence'',''on'')
          %}notify.echo_kitchen_announce {% else %}notify.echo_living_room_announce{%
          endif %}

          '
      data:
        message: The washing machine is done.
- id: leave_home
  alias: Presence · everyone left
  triggers:
  - trigger: state
    entity_id: zone.home
    to: '0'
    for: 00:05:00
  actions:
  - action: light.turn_off
    target:
      entity_id: all
  - action: switch.turn_off
    target:
      entity_id: switch.rice_cooker
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: binary_sensor.main_door
        state: 'on'
      - condition: state
        entity_id: binary_sensor.balcony_door
        state: 'on'
    then:
    - action: notify.mobile_app_azizs_iphone
      data:
        title: Nobody's home
        message: 'Lights are off, but {{ ''the main door'' if is_state(''binary_sensor.main_door'',''on'')
          else ''the balcony door'' }} is open.

          '
- id: arrive_home
  alias: Presence · welcome light after dark
  triggers:
  - trigger: state
    entity_id: zone.home
    from: '0'
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  - condition: state
    entity_id: light.living_room_lights
    state: 'off'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.living_room_lights
    data:
      brightness_pct: '{{ state_attr(''sensor.light_mode'', ''brightness_pct'') }}'
      color_temp_kelvin: '{{ state_attr(''sensor.light_mode'', ''kelvin'') }}'
- id: rice_cooker_timeout
  alias: Kitchen · rice cooker off after 90 min
  triggers:
  - trigger: state
    entity_id: switch.rice_cooker
    to: 'on'
    for: 01:30:00
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.rice_cooker
  - action: notify.mobile_app_azizs_iphone
    data:
      title: Rice cooker
      message: Switched off after 90 minutes.
- id: balcony_door_heating
  alias: Living room · heating paused while the balcony door is open
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.balcony_door
    to: 'on'
    for: 00:02:00
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.living_room
      state: 'off'
  actions:
  - action: climate.set_hvac_mode
    target:
      entity_id: climate.living_room
    data:
      hvac_mode: 'off'
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.balcony_door
      to: 'off'
  - action: climate.set_hvac_mode
    target:
      entity_id: climate.living_room
    data:
      hvac_mode: auto
- id: remote_living_room_wheel
  alias: Remote · Living room scroll wheel
  mode: queued
  max: 30
  triggers:
  - trigger: state
    entity_id:
    - event.living_room_wheel_button_1
    - event.living_room_wheel_button_2
    - event.living_room_wheel_button_3
    - event.living_room_wheel_button_4
    - event.living_room_wheel_button_5
    - event.living_room_wheel_button_6
    - event.living_room_wheel_button_7
    - event.living_room_wheel_button_8
    - event.living_room_wheel_button_9
    not_from:
    - unavailable
    not_to:
    - unavailable
    - unknown
  variables:
    n: '{{ trigger.entity_id[-1] | int }}'
    kind: '{{ [''up'', ''down'', ''press''][(n - 1) % 3] }}'
    ev: '{{ trigger.to_state.attributes.event_type }}'
  actions:
  - action: script.remote_light
    data:
      target: '{{ [''light.living_room_lights'', ''light.living_room_ceiling'', ''light.living_room_lamp''][(n
        - 1) // 3] }}'
      kind: '{{ kind }}'
      ev: '{{ ev }}'
      scene: scene.movie
