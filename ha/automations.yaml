- id: sunset_lamps
  alias: Schedule · lamps on at sunset
  triggers:
  - trigger: sun
    event: sunset
    offset: -00:30:00
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  - condition: numeric_state
    entity_id: zone.home
    above: 0
  actions:
  - action: light.turn_on
    target:
      entity_id: light.living_room_lamp
  - action: light.turn_on
    target:
      entity_id:
      - light.studio_lamp
      - light.bedside_lamps
    data:
      brightness_pct: '{{ state_attr(''sensor.light_mode'', ''brightness_pct'') }}'
      color_temp_kelvin: '{{ state_attr(''sensor.light_mode'', ''kelvin'') }}'
- id: wake_up_light
  alias: Schedule · weekday wake-up light
  description: 20 minutes before the wake-up time (weekday time Mon-Fri, weekend time
    Sat-Sun) the bedside lamps fade up slowly from a dim warm glow; after the fade the
    bathroom heats to 22 C for an hour.
  triggers:
  - trigger: time
    at:
      entity_id: input_datetime.wake_time
      offset: -00:20:00
    id: weekday
  - trigger: time
    at:
      entity_id: input_datetime.wake_time_weekend
      offset: -00:20:00
    id: weekend
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: weekday
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
    - condition: and
      conditions:
      - condition: trigger
        id: weekend
      - condition: time
        weekday:
        - sat
        - sun
  - condition: state
    entity_id: input_boolean.wake_up_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.bedside_lamps
    data:
      brightness_pct: 1
      color_temp_kelvin: 2200
  - delay: 2
  - action: light.turn_on
    target:
      entity_id: light.bedside_lamps
    data:
      brightness_pct: 80
      color_temp_kelvin: 3500
      transition: 1200
  - delay: 00:20:00
  - action: tado_x.set_climate_timer
    data:
      entity_id: climate.bathroom
      temperature: 22
      duration: 60
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.climate_timer_bathroom
    data:
      datetime: '{{ (now() + timedelta(minutes=60)).strftime(''%Y-%m-%d %H:%M:%S'')
        }}'
- id: balcony_lights_on
  alias: Schedule · balcony lights on at sunset
  triggers:
  - trigger: sun
    event: sunset
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.balcony_lights
- id: balcony_lights_off
  alias: Schedule · balcony lights off at 23:00
  triggers:
  - trigger: time
    at: '23:00:00'
  actions:
  - action: light.turn_off
    target:
      entity_id: light.balcony_lights
- id: kitchen_motion_light
  alias: Kitchen · motion light
  description: Turns the light on only if it is off and the room is dark. Brightness
    and colour come from sensor.light_mode (packages/lighting.yaml). Never overrides
    a light you set yourself; off after 3 min without motion. From 23:00 to 06:00
    it comes on at 10 % in the warmest white (2202 K).
  triggers:
  - trigger: state
    entity_id: binary_sensor.kitchen_motion
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: light.kitchen_ceiling
      state: unavailable
  actions:
  - if:
    - condition: state
      entity_id: light.kitchen_ceiling
      state: 'off'
    - condition: numeric_state
      entity_id: sensor.kitchen_illuminance
      below: 30
    then:
    - action: light.turn_on
      target:
        entity_id: light.kitchen_ceiling
      data:
        brightness_pct: '{{ 10 if (now().hour >= 23 or now().hour < 6) else state_attr(''sensor.light_mode'',
          ''brightness_pct'') }}'
        color_temp_kelvin: '{{ 2202 if (now().hour >= 23 or now().hour < 6) else state_attr(''sensor.light_mode'',
          ''kelvin'') }}'
        transition: 1
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.kitchen_motion
      to: 'off'
      for: 00:03:00
  - condition: state
    entity_id: light.kitchen_ceiling
    state: 'on'
  - action: light.turn_off
    target:
      entity_id: light.kitchen_ceiling
    data:
      transition: 2
  mode: restart
- id: hallway_motion_light
  alias: Hallway · motion light
  description: Turns the light on when the hallway is dark and it is off; brightness
    and colour come from sensor.light_mode. Off after 2 min without motion. From 23:00
    to 06:00 it comes on at 10 % in the warmest white (2202 K).
  triggers:
  - trigger: state
    entity_id: binary_sensor.hallway_motion
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: light.hallway_light
      state: unavailable
  actions:
  - if:
    - condition: state
      entity_id: light.hallway_light
      state: 'off'
    - condition: numeric_state
      entity_id: sensor.hallway_illuminance
      below: 40
    then:
    - action: light.turn_on
      target:
        entity_id: light.hallway_light
      data:
        brightness_pct: '{{ 10 if (now().hour >= 23 or now().hour < 6) else state_attr(''sensor.light_mode'',
          ''brightness_pct'') }}'
        color_temp_kelvin: '{{ 2202 if (now().hour >= 23 or now().hour < 6) else state_attr(''sensor.light_mode'',
          ''kelvin'') }}'
        transition: 1
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.hallway_motion
      to: 'off'
      for: 00:02:00
  - condition: state
    entity_id: light.hallway_light
    state: 'on'
  - action: light.turn_off
    target:
      entity_id: light.hallway_light
    data:
      transition: 2
  mode: restart
- id: studio_presence_on
  alias: Studio · lamp on when someone is there and it's dark
  triggers:
  - trigger: state
    entity_id: binary_sensor.studio_presence
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  - condition: state
    entity_id: light.studio_lamp
    state: 'off'
  - condition: numeric_state
    entity_id: sensor.studio_illuminance
    below: 150
  actions:
  - action: light.turn_on
    target:
      entity_id: light.studio_lamp
    data:
      brightness_pct: '{{ state_attr(''sensor.light_mode'', ''brightness_pct'') }}'
      color_temp_kelvin: '{{ state_attr(''sensor.light_mode'', ''kelvin'') }}'
- id: studio_presence_off
  alias: Studio · lights off when empty for 5 min
  triggers:
  - trigger: state
    entity_id: binary_sensor.studio_presence
    to: 'off'
    for: 00:05:00
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  actions:
  - action: light.turn_off
    target:
      entity_id: light.studio_lights
    data:
      transition: 5
- id: washer_done_announce
  alias: Washer · announce when finished
  triggers:
  - trigger: state
    entity_id: sensor.washer_operation_state
    to: finished
  actions:
  - action: notify.mobile_app_azizs_iphone
    data:
      title: Washer
      message: The washing machine is done.
  - action: notify.mobile_app_iphone_wifey
    data:
      title: Washer
      message: The washing machine is done.
  - if:
    - condition: time
      after: 08:00:00
      before: '22:00:00'
    - condition: numeric_state
      entity_id: zone.home
      above: 0
    then:
    - action: notify.send_message
      target:
        entity_id: '{% if is_state(''binary_sensor.studio_presence'',''on'') %}notify.echo_studio_speak
          {% elif is_state(''binary_sensor.kitchen_motion'',''on'') or is_state(''binary_sensor.echo_kitchen_presence'',''on'')
          %}notify.echo_kitchen_speak {% else %}notify.echo_living_room_speak{%
          endif %}

          '
      data:
        message: The washing machine is done.
- id: leave_home
  alias: Presence · everyone left
  description: 'Five minutes after everyone left: all lights and the rice cooker off.
    Door warnings come from the leaving check. Also turns the TV off through the
    living-room Echo (Alexa text command; a failure never blocks the rest).'
  triggers:
  - trigger: state
    entity_id: zone.home
    to: '0'
    for: 00:05:00
  actions:
  - action: light.turn_off
    target:
      entity_id: all
  - action: switch.turn_off
    target:
      entity_id: switch.rice_cooker
  - action: alexa_devices.send_text_command
    continue_on_error: true
    data:
      device_id: 5c1cc20b821f547aa2b140387426c229
      text_command: turn off the TV
- id: arrive_home
  alias: Presence · welcome home
  description: 'When Aziz or Hatice arrives, wait for the main door to open (10 min
    at most). If the home was empty and it is dark: living-room lamp, hallway light
    and bedside lamps on at the time-of-day values. Between 07:00 and 23:00 the kitchen
    Echo greets them by name; if both arrive together (within 2 min) they get one
    joint greeting.'
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: state
    entity_id: person.muhammad_aziz_ur_rehman
    to: home
    not_from: [unknown, unavailable]
    id: aziz
  - trigger: state
    entity_id: person.wifey
    to: home
    not_from: [unknown, unavailable]
    id: wifey
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  actions:
  - variables:
      t0: "{{ now().isoformat() }}"
      tid: "{{ trigger.id }}"
      other: "{{ 'person.wifey' if trigger.id == 'aziz' else 'person.muhammad_aziz_ur_rehman' }}"
      was_empty: "{{ not is_state(other, 'home') }}"
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.main_door
      to: 'on'
    timeout: 00:10:00
    continue_on_timeout: true
  - if:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
    - condition: template
      value_template: '{{ was_empty }}'
    then:
    - action: light.turn_on
      target:
        entity_id: light.living_room_lamp
    - action: light.turn_on
      target:
        entity_id:
        - light.hallway_light
        - light.bedside_lamps
      data:
        brightness_pct: '{{ state_attr(''sensor.light_mode'', ''brightness_pct'') }}'
        color_temp_kelvin: '{{ state_attr(''sensor.light_mode'', ''kelvin'') }}'
  - variables:
      spoken: >-
        {% set t = as_datetime(t0) - timedelta(minutes=2) %}
        {% set a = tid == 'aziz' or (is_state('person.muhammad_aziz_ur_rehman', 'home') and states.person.muhammad_aziz_ur_rehman.last_changed >= t) %}
        {% set h = tid == 'wifey' or (is_state('person.wifey', 'home') and states.person.wifey.last_changed >= t) %}
        {% set names = (['Aziz'] if a else []) + (['<lang xml:lang="tr-TR">Hatice</lang>'] if h else []) %}
        <speak>As-salaamu alaykum, {{ names | join(' and ') }}.</speak>
  - if:
    - condition: time
      after: '07:00:00'
      before: '23:00:00'
    then:
    - action: notify.send_message
      target:
        entity_id: notify.echo_kitchen_speak
      data:
        message: '{{ spoken }}'
- id: rice_cooker_timeout
  alias: Kitchen · rice cooker off after 60 min
  triggers:
