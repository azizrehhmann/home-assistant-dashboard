    entity_id:
    - event.living_room_wheel_button_1
    - event.living_room_wheel_button_2
    - event.living_room_wheel_button_3
    - event.living_room_wheel_button_4
    - event.living_room_wheel_button_5
    - event.living_room_wheel_button_6
    - event.living_room_wheel_button_7
    - event.living_room_wheel_button_8
    - event.living_room_wheel_button_9
    not_from:
    - unavailable
    not_to:
    - unavailable
    - unknown
  variables:
    n: '{{ trigger.entity_id[-1] | int }}'
