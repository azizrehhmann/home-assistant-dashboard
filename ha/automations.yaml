  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.balcony_door
      to: 'off'
  - action: climate.set_hvac_mode
    target:
      entity_id: climate.living_room
    data:
      hvac_mode: auto
- id: remote_living_room_wheel
  alias: Remote · Living room scroll wheel
  mode: queued
  max: 30
  triggers:
