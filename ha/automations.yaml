- id: remote_bedroom_dual_button
  alias: Remote · Bedroom dual button
  mode: queued
  triggers:
  - trigger: state
    entity_id:
    - event.bedroom_dual_button_1
    - event.bedroom_dual_button_2
    not_from:
    - unavailable
    not_to:
    - unavailable
    - unknown
  variables:
    ev: '{{ trigger.to_state.attributes.event_type }}'
  actions:
  - choose:
    - conditions: '{{ trigger.entity_id.endswith(''_1'') and ev == ''multi_press_1''
        }}'
      sequence:
      - action: light.toggle
        target:
          entity_id: light.bedside_lamps
    - conditions: '{{ trigger.entity_id.endswith(''_1'') and ev == ''long_press''
        }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bedside_lamps
        data:
          brightness_pct: 30
          color_temp_kelvin: 2200
    - conditions: '{{ trigger.entity_id.endswith(''_2'') and ev == ''multi_press_1''
        }}'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.night
- id: fresh_air_nudge
  alias: Air · fresh-air nudge when CO2 is high
  description: When CO2 stays above 1000 ppm for 10 minutes (or is already above at
    08:00) and the vacation mode is off, announces on the Echo in the occupied room
    and pushes to whoever is home, while the balcony door is closed, someone is home
    and it is 08:00-22:00. Repeats every hour until CO2 is back at 1000 ppm or below
    (at most 16 times).
  triggers:
  - trigger: numeric_state
    entity_id: sensor.air_quality_co2
    above: 1000
    for: 00:10:00
  - trigger: time
    at: 08:00:00
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  - condition: template
    value_template: '{{ states(''sensor.air_quality_co2'') | float(0) > 1000 }}'
  actions:
  - repeat:
      sequence:
      - if:
        - condition: numeric_state
          entity_id: zone.home
          above: 0
        - condition: time
          after: 08:00:00
          before: '22:00:00'
        - condition: state
          entity_id: binary_sensor.balcony_door
          state: 'off'
        then:
        - action: notify.send_message
          target:
            entity_id: '{% if is_state(''binary_sensor.studio_presence'',''on'') %}notify.echo_studio_speak
              {% elif is_state(''binary_sensor.kitchen_motion'',''on'') or is_state(''binary_sensor.echo_kitchen_presence'',''on'')
              %}notify.echo_kitchen_speak {% else %}notify.echo_living_room_speak{%
              endif %}

              '
          data:
            message: CO2 is at {{ states('sensor.air_quality_co2') | float(0) | round(0)
              | int }} ppm - open the balcony door for five minutes.
        - if:
          - condition: state
            entity_id: person.muhammad_aziz_ur_rehman
            state: home
          then:
          - action: notify.mobile_app_azizs_iphone
            data:
              title: Fresh air
              message: CO2 is at {{ states('sensor.air_quality_co2') | float(0) |
                round(0) | int }} ppm - open the balcony door for five minutes.
        - if:
          - condition: state
            entity_id: person.wifey
            state: home
          then:
          - action: notify.mobile_app_iphone_wifey
            data:
              title: Fresh air
              message: CO2 is at {{ states('sensor.air_quality_co2') | float(0) |
                round(0) | int }} ppm - open the balcony door for five minutes.
      - wait_template: '{{ states(''sensor.air_quality_co2'') | float(0) <= 1000 }}'
        timeout: 01:00:00
        continue_on_timeout: true
      until: '{{ states(''sensor.air_quality_co2'') | float(0) <= 1000 or repeat.index
        >= 16 }}'
  mode: single
- id: goodnight_bottom_button
  alias: Bedroom · goodnight (hold bottom button)
  description: Holding the bottom bedroom button turns off every light except the
    bedside lamps, lowers living-room and studio heating to 17 C until 06:30 and pushes
    a door check.
  triggers:
  - trigger: state
    entity_id: event.bedroom_dual_button_2
    not_from:
    - unavailable
    not_to:
    - unavailable
    - unknown
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.attributes.event_type == ''long_press'' }}'
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.living_room_lights
      - light.living_room_lamp
      - light.kitchen_ceiling
      - light.hallway_light
      - light.studio_lights
      - light.bedroom_ceiling
      - light.tv_lights
  - variables:
      mins: '{% set t = now().replace(hour=6, minute=30, second=0, microsecond=0)
        %}{% if t <= now() %}{% set t = t + timedelta(days=1) %}{% endif %}{{ [((t
        - now()).total_seconds() / 60) | round(0) | int, 1440] | min }}'
      open: '{{ [ ''the balcony door'' if is_state(''binary_sensor.balcony_door'',''on'')
        else none, ''the main door'' if is_state(''binary_sensor.main_door'',''on'')
        else none ] | reject(''none'') | join('' and '') }}'
  - repeat:
      for_each:
      - living_room
      - studio
      sequence:
      - action: tado_x.set_climate_timer
        data:
          entity_id: climate.{{ repeat.item }}
          temperature: 17
          duration: '{{ mins }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.climate_timer_{{ repeat.item }}
        data:
          datetime: '{{ (now() + timedelta(minutes=mins)).strftime(''%Y-%m-%d %H:%M:%S'')
            }}'
  - action: notify.mobile_app_azizs_iphone
    data:
      title: Goodnight
      message: '{% if open %}Still open: {{ open }}.{% else %}All closed, good night.{%
        endif %}'
  - action: notify.mobile_app_iphone_wifey
    data:
      title: Goodnight
      message: '{% if open %}Still open: {{ open }}.{% else %}All closed, good night.{%
        endif %}'
  mode: single
- id: leaving_checks
  alias: Presence · leaving check (doors and rice cooker)
  description: 'Two minutes after everyone left, pushes a list of anything still open
    or on: main door, balcony door, rice cooker.'
  triggers:
  - trigger: state
    entity_id: zone.home
    to: '0'
    for: 00:02:00
  conditions:
  - condition: template
    value_template: '{{ is_state(''binary_sensor.main_door'',''on'') or is_state(''binary_sensor.balcony_door'',''on'')
      or is_state(''switch.rice_cooker'',''on'') }}'
  actions:
  - variables:
      items: '{% set ns = namespace(l=[]) %}{% if is_state(''binary_sensor.main_door'',''on'')
        %}{% set ns.l = ns.l + [''the main door is open''] %}{% endif %}{% if is_state(''binary_sensor.balcony_door'',''on'')
        %}{% set ns.l = ns.l + [''the balcony door is open''] %}{% endif %}{% if is_state(''switch.rice_cooker'',''on'')
        %}{% set ns.l = ns.l + [''the rice cooker is on (it switches off automatically)'']
        %}{% endif %}{{ ns.l | join('', '') }}'
  - action: notify.mobile_app_azizs_iphone
    data:
      title: Nobody's home
      message: 'Heads up: {{ items }}.'
  - action: notify.mobile_app_iphone_wifey
    data:
      title: Nobody's home
      message: 'Heads up: {{ items }}.'
  mode: single
- id: robot_clean_when_away
  alias: Robot · clean when everyone is out
  description: Monday to Saturday, starts a whole-flat clean when nobody has been
    home for 10 minutes (09:00-19:00), the robot is docked with at least 50 % battery
    and has not finished a full clean today (input_datetime.robot_last_full_clean,
    set by Robot · mark full clean). A clean cut short by someone coming home does
    not count, so it runs again the next time everyone is out.
  triggers:
  - trigger: numeric_state
    entity_id: zone.home
    below: 1
    for: 00:10:00
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  - condition: time
    after: 09:00:00
    before: '19:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
  - condition: state
    entity_id: vacuum.roborock_q5_pro
    state: docked
  - condition: numeric_state
    entity_id: sensor.studio_roborock_battery
    above: 49
  - alias: Has not finished a full clean today
    condition: template
    value_template: '{% set t = as_datetime(states(''input_datetime.robot_last_full_clean''),
      none) %}{{ t is none or t.date() != now().date() }}'
  actions:
  - action: vacuum.start
    target:
      entity_id: vacuum.roborock_q5_pro
  mode: single
- id: robot_dock_on_arrival
  alias: Robot · return to dock when someone comes home
  description: Sends the robot back to its dock if it is cleaning when someone arrives
    home and flags the clean as recalled (it does not count as done); the next time
    everyone is out the same day it cleans again.
  triggers:
  - trigger: numeric_state
    entity_id: zone.home
    above: 0
  conditions:
  - condition: state
    entity_id: vacuum.roborock_q5_pro
    state: cleaning
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.robot_recalled
  - action: vacuum.return_to_base
    target:
      entity_id: vacuum.roborock_q5_pro
  mode: single
- id: robot_maintenance_weekly
  alias: Robot · weekly maintenance check
  description: Sundays at 10:00, pushes to both phones which robot parts (main brush,
    side brush, filter, sensors) have under 5 hours left or are overdue; silent if
    none.
  triggers:
  - trigger: time
    at: '10:00:00'
  conditions:
  - condition: time
    weekday:
    - sun
  actions:
  - variables:
      due: '{% set items = [(''Main brush'',''sensor.studio_roborock_main_brush_time_left''),(''Side
        brush'',''sensor.studio_roborock_side_brush_time_left''),(''Filter'',''sensor.studio_roborock_filter_time_left''),(''Sensors'',''sensor.studio_roborock_sensor_time_left'')]
        %}{% set ns = namespace(l=[]) %}{% for n, e in items %}{% set v = states(e)
        | float(none) %}{% if v is not none and v < 5 %}{% set ns.l = ns.l + [n ~
        ('' '' ~ ((-v) | round(0) | int) ~ '' h overdue'' if v < 0 else '' '' ~ (v
        | round(0) | int) ~ '' h left'')] %}{% endif %}{% endfor %}{{ ns.l | join('',
        '') }}'
  - condition: template
    value_template: '{{ due | length > 0 }}'
  - action: notify.mobile_app_azizs_iphone
    data:
      title: Robot maintenance
      message: 'Time to service the vacuum: {{ due }}.'
  - action: notify.mobile_app_iphone_wifey
    data:
      title: Robot maintenance
      message: 'Time to service the vacuum: {{ due }}.'
  mode: single
- id: studio_focus
  alias: Studio · focus mode on desk time
  description: On weekdays 09:00-17:00, 2 minutes of presence in the studio sets the
    Focus scene and Studio Echo do-not-disturb; 10 minutes without presence turns
    do-not-disturb off.
  triggers:
  - trigger: state
    entity_id: binary_sensor.studio_presence
    to: 'on'
    for: 00:02:00
    id: occupied
  - trigger: state
    entity_id: binary_sensor.studio_presence
    to: 'off'
    for: 00:10:00
    id: clear
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: occupied
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: 'off'
      - condition: time
        after: 09:00:00
        before: '17:00:00'
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.focus
      - action: switch.turn_on
        target:
          entity_id: switch.echo_studio_do_not_disturb
    - conditions:
      - condition: trigger
        id: clear
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.echo_studio_do_not_disturb
  mode: restart
- id: washer_wet_laundry_reminder
  alias: Washer · wet laundry reminder
  description: Reminds both phones (and the Echo in the occupied room) if the washer
    is still finished and switched on 30 minutes later.
  triggers:
  - trigger: state
    entity_id: sensor.washer_operation_state
    to: finished
  conditions: []
  actions:
  - alias: Wait 30 min; abort if the washer is switched off or a new program starts
    wait_for_trigger:
    - trigger: state
      entity_id: switch.kitchen_washing_machine_power
      to: 'off'
    - trigger: state
      entity_id: sensor.washer_operation_state
      from: finished
    timeout: 00:30:00
    continue_on_timeout: true
  - condition: template
    value_template: '{{ wait.trigger is none }}'
  - action: notify.mobile_app_azizs_iphone
    data:
      title: Washer
      message: Laundry has been sitting in the washing machine for 30 minutes - hang
        it up before it gets musty.
  - action: notify.mobile_app_iphone_wifey
    data:
      title: Washer
      message: Laundry has been sitting in the washing machine for 30 minutes - hang
        it up before it gets musty.
  - if:
    - condition: time
      after: 08:00:00
      before: '22:00:00'
    - condition: numeric_state
      entity_id: zone.home
      above: 0
    then:
    - action: notify.send_message
      target:
        entity_id: '{% if is_state(''binary_sensor.studio_presence'',''on'') %}notify.echo_studio_speak
          {% elif is_state(''binary_sensor.kitchen_motion'',''on'') or is_state(''binary_sensor.echo_kitchen_presence'',''on'')
          %}notify.echo_kitchen_speak {% else %}notify.echo_living_room_speak{%
          endif %}

          '
      data:
        message: Laundry has been sitting in the washing machine for 30 minutes -
          hang it up before it gets musty.
  mode: single
- id: morning_weather_briefing
  alias: Kitchen · morning weather briefing
  description: First kitchen motion after the wake-up light starts (wake time -20 min,
    weekday or weekend time) and within 3 h, once a day; the Kitchen Echo says today's
    weather and warns about rain or snow.
  triggers:
  - trigger: state
    entity_id: binary_sensor.kitchen_motion
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  - condition: state
    entity_id: input_boolean.wake_up_enabled
    state: 'on'
  - condition: numeric_state
    entity_id: zone.home
    above: 0
  - condition: template
    value_template: "{% set t = states('input_datetime.wake_time_weekend' if now().weekday() >= 5 else 'input_datetime.wake_time') %}{% set s = today_at(t) - timedelta(minutes=20) %}{% set lt = this.attributes.last_triggered %}{{ s <= now() <= s + timedelta(hours=3) and (lt is none or as_local(lt).date() != now().date()) }}"
  actions:
  - action: weather.get_forecasts
    data:
      type: daily
    target:
      entity_id: weather.forecast_home
    response_variable: fc
  - variables:
      d: "{{ fc['weather.forecast_home'].forecast[0] }}"
      msg: >-
        {% set names = {'sunny': 'sunny', 'clear-night': 'clear', 'partlycloudy': 'partly cloudy', 'cloudy': 'cloudy', 'fog': 'foggy', 'rainy': 'rainy', 'pouring': 'very rainy', 'lightning': 'stormy', 'lightning-rainy': 'stormy', 'snowy': 'snowy', 'snowy-rainy': 'sleety', 'windy': 'windy', 'windy-variant': 'windy', 'hail': 'hail'} %}
        {% set c = d.condition %}
        {% set words = names.get(c, c | replace('-', ' ')) %}
        Good morning. Today will be {{ words }}, with a high of {{ d.temperature | round }}{% if d.templow is defined and d.templow is not none %} and a low of {{ d.templow | round }}{% endif %} degrees.
        {%- if c in ['snowy', 'snowy-rainy'] %} Snow is expected, dress warm and take care outside.
        {%- elif c in ['rainy', 'pouring', 'lightning-rainy', 'hail'] or d.precipitation | default(0) | float(0) > 0.5 or d.precipitation_probability | default(0) | float(0) >= 50 %} Rain is expected, take an umbrella.
        {%- endif %}
  - action: notify.send_message
    target:
      entity_id: notify.echo_kitchen_speak
    data:
      message: '{{ msg }}'
  mode: single
